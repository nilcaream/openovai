<!doctype html>
<meta charset="utf-8">
<title>Office workspace chat</title>

<h1 id="who">Chat</h1>

<h2>The room</h2>
<div id="room"></div>

<!-- Opening a desk for somebody new. Written here rather than built in the script because it is
     fixed content and not a panel: nothing about it depends on who works here, so there is nothing
     for the script to decide and no way for it to be built and never attached. -->
<form id="hiring">
  <input id="named" placeholder="A name" autocomplete="off">
  <button id="hire" type="submit">Hire</button>
  <span id="refusal"></span>
</form>

<div id="panels"></div>

<script type="module">
  // Deliberately plain. The point of this page is that every session in the workspace can be
  // typed to and read back in one place; how it looks is a later question.
  //
  // One panel per session, built from what the server says works here. The server reads that from
  // the desks each time it is asked, so a desk opened while the chat is running is a panel on the
  // next load of this page.
  const panels = document.getElementById("panels");

  // Who works here is settled at load: the panels are built once from /sessions, so the set of
  // them is a load-time fact. Anything that changes it — hiring somebody, a session leaving —
  // loads the page again rather than growing a panel lifecycle nobody has asked for.
  function whoWorksHereChanged() {
    location.reload();
  }

  // Hiring, wired before anything is fetched: it is the one thing on this page that works when
  // there is nobody to show yet.
  const hiring = document.getElementById("hiring");
  const named = document.getElementById("named");
  const hire = document.getElementById("hire");
  const refusal = document.getElementById("refusal");

  hiring.addEventListener("submit", async (event) => {
    event.preventDefault();
    const name = named.value.trim();
    if (name === "") {
      return;
    }
    hire.disabled = true;
    refusal.textContent = "";
    try {
      const answered = await fetch("/sessions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name }),
      });
      if (answered.ok) {
        whoWorksHereChanged();
        return;
      }
      // In the words the route used, which are the words `ow hire` prints. A page that reworded a
      // refusal would be a second answer to what a name is refused for.
      refusal.textContent = (await answered.json()).error;
    } finally {
      hire.disabled = false;
    }
  });

  const health = await fetch("/health").then((response) => response.json());
  document.getElementById("who").textContent = `${health.leader} — ${health.instance}`;

  const { sessions } = await fetch("/sessions").then((response) => response.json());

  function said(message) {
    const line = document.createElement("p");
    const who = message.from === "human" ? health.human : message.from;
    // A session that answered with nothing gets a sentence rather than a blank line, which
    // would read as the chat having lost the reply.
    const said = message.silent ? "(ended its turn without saying anything)" : message.text;
    line.textContent = `${who}${message.failed ? " (failed)" : ""}: ${said}`;
    return line;
  }

  // The room: one line per session, so that deciding whom to talk to and whom to hand over does
  // not mean opening every panel and reading it. Everything in it comes off the same rows the
  // panels are already asking for once a second, so it costs the page nothing new.
  const room = document.getElementById("room");

  // How long ago, in the roughest terms that are still useful. Nothing anybody decides from this
  // page turns on the difference between four minutes and five.
  function ago(when) {
    if (typeof when !== "string") {
      return null;
    }
    const seconds = Math.round((Date.now() - Date.parse(when)) / 1000);
    if (seconds < 60) {
      return "just now";
    }
    if (seconds < 3600) {
      return `${Math.floor(seconds / 60)}m ago`;
    }
    return `${Math.floor(seconds / 3600)}h ago`;
  }

  // What a session is doing, as one phrase, in the order that decides what to do about it. Held up
  // by a person comes first, because it is the only one the person reading this can end; then held
  // up by another session, which is not the same as being slow; then busy, with the pile behind it.
  function state(row) {
    if (row.asking > 0) {
      return row.asking === 1 ? "needs you" : `needs you (${row.asking})`;
    }
    if (row.waitingFor !== null && row.waitingFor !== undefined) {
      return `waiting for ${row.waitingFor}`;
    }
    if (row.queued > 0) {
      return `answering, ${row.queued} waiting`;
    }
    return row.busy ? "answering" : "idle";
  }

  // Facts, in one line, and no verdict on any of them. Whether a session that has been quiet for
  // an hour is finished, stuck or thinking is not something this page can know, and a page that
  // guessed would be wrong in the way that looks like an answer.
  function inTheRoom(row) {
    const line = document.createElement("p");

    const who = document.createElement("strong");
    who.textContent = row.name;

    const rest = document.createElement("span");
    const when = ago(row.active);
    const how = [
      state(row),
      // Said only when there is none, because that is the surprising half: a full panel whose
      // session remembers none of it reads as an ordinary one until somebody says so.
      row.thread ? null : "nothing to carry on",
      typeof row.context === "number" ? `${row.context.toLocaleString("en-US")} tokens` : null,
      when === null ? "nothing said yet" : `last moved ${when}`,
    ].filter((part) => part !== null);

    rest.textContent = ` — ${row.role} (${row.model})${row.doing === "" ? "" : ` — ${row.doing}`} — ${how.join(" · ")}`;

    line.append(who, rest);
    return line;
  }

  function showTheRoom(rows) {
    room.replaceChildren(...rows.map(inTheRoom));
  }

  function panel(session) {
    const section = document.createElement("section");

    const heading = document.createElement("h2");
    heading.textContent = `${session.name} — ${session.role} (${session.model})`;

    // Whether this session is in the middle of a turn. It is a word beside the name and nothing
    // else: the panel already shows what was said, and what is wanted here is only the difference
    // between a session thinking and a session with nothing to do.
    const mood = document.createElement("span");

    // How much of itself this session's conversation is carrying, so that whoever is reading can
    // tell when it is worth handing over rather than finding out from the answers. It is where the
    // thread stood at the END of its last turn, which is what the phrasing says: a turn going on
    // right now is already past it, and there is no way to ask a run in progress.
    //
    // A count, not a share of anything. What a model can hold would have to be kept in a table
    // here, and a number that is quietly wrong is worse than one that needs a moment's thought.
    const size = document.createElement("span");

    heading.append(mood, size);

    const transcript = document.createElement("div");

    const box = document.createElement("textarea");
    box.rows = 3;
    box.cols = 80;
    box.placeholder = `Write to ${session.name}`;

    const send = document.createElement("button");
    send.type = "submit";
    send.textContent = "Send";

    // End the thread that has been answering, so the next message starts a new one that reads
    // this session's desk first. It is a button and not a form: a handover takes no words.
    //
    // Not disabled while the session is busy. A handover waits its turn like anything else, and
    // the moment somebody wants one is usually the moment the session is in the middle of
    // something — a button that could only be pressed on an idle panel would be no use.
    const hand = document.createElement("button");
    hand.type = "button";
    hand.textContent = "Hand over";

    // And the exit: the session is asked to write its desk one last time, and the desk and the
    // panel are filed away together. Not offered on the lead's panel, because an instance has a
    // lead by definition and this page is hosted by it — a lead that left would still be here,
    // with nothing to read what it was doing from. The route refuses it too; this is so nobody is
    // offered a button that cannot work.
    const leave = session.role === "lead" ? null : document.createElement("button");
    if (leave !== null) {
      leave.type = "button";
      leave.textContent = "Leave";
    }

    const composer = document.createElement("form");
    composer.className = "composer";
    composer.append(box, send, hand, ...(leave === null ? [] : [leave]));

    // Where this session says what it wants to be allowed to do. Empty almost always: only a tool
    // the instance has not already settled one way or the other ever gets this far.
    const asking = document.createElement("div");

    section.append(heading, transcript, asking, composer);

    async function show() {
      const answered = await fetch(`/sessions/${session.name}/messages`);
      const { messages } = await answered.json();
      transcript.replaceChildren(...messages.map(said));
    }

    // A request is answered by whoever is at the page, so the page has to notice one arriving
    // without having been the one who caused it. Nothing else here polls; this is the one thing
    // that starts on the far side.
    function question(request) {
      const line = document.createElement("p");

      const what = document.createElement("span");
      what.textContent = `${session.name} wants to use ${request.tool}: ${JSON.stringify(request.input)} `;

      const yes = document.createElement("button");
      yes.type = "button";
      yes.textContent = "Allow";

      const no = document.createElement("button");
      no.type = "button";
      no.textContent = "Deny";

      for (const [button, decision] of [
        [yes, "allow"],
        [no, "deny"],
      ]) {
        button.addEventListener("click", async () => {
          yes.disabled = true;
          no.disabled = true;
          await fetch(`/sessions/${session.name}/permission`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ id: request.id, decision }),
          });
          await waiting();
        });
      }

      line.append(what, yes, no);
      return line;
    }

    async function waiting() {
      const answered = await fetch(`/sessions/${session.name}/permissions`);
      const { permissions } = await answered.json();
      asking.replaceChildren(...permissions.map(question));
    }

    composer.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = box.value;
      if (text.trim() === "") {
        return;
      }
      box.value = "";
      // A reply takes as long as it takes, and the panel says so rather than looking broken.
      transcript.append(
        said({ from: "human", text }),
        Object.assign(document.createElement("p"), { textContent: "…" }),
      );
      await fetch(`/sessions/${session.name}/message`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      await show();
    });

    // Pressed once, until it is done. A second handover queued behind the first would ask a
    // session that has just written its desk to write it again, from a thread that remembers
    // nothing — which is not what anybody pressing this twice meant.
    hand.addEventListener("click", async () => {
      hand.disabled = true;
      transcript.append(Object.assign(document.createElement("p"), { textContent: "…" }));
      try {
        await fetch(`/sessions/${session.name}/handover`, { method: "POST" });
        await show();
      } finally {
        hand.disabled = false;
      }
    });

    // Pressed once, for the reason the handover is: leaving is a turn, and a second one queued
    // behind the first would be asked of a name that is not here any more. It stays disabled when
    // it works, because the page is about to load again.
    leave?.addEventListener("click", async () => {
      leave.disabled = true;
      transcript.append(Object.assign(document.createElement("p"), { textContent: "…" }));
      const answered = await fetch(`/sessions/${session.name}/leave`, { method: "POST" });
      if (answered.ok) {
        whoWorksHereChanged();
        return;
      }
      await show();
      leave.disabled = false;
    });

    function busy(is) {
      mood.textContent = is ? " (answering…)" : "";
    }

    // Nothing at all until the session has answered once: a conversation that has not started has
    // no size, and a zero there would read as one that had.
    function carrying(tokens) {
      size.textContent =
        typeof tokens === "number" ? ` — ${tokens.toLocaleString("en-US")} tokens after its last turn` : "";
    }

    return { name: session.name, section, show, waiting, busy, carrying };
  }

  const built = sessions.map(panel);
  panels.replaceChildren(...built.map(({ section }) => section));
  showTheRoom(sessions);
  await Promise.all(built.map(({ show }) => show()));
  for (const panel of built) {
    panel.carrying(sessions.find((session) => session.name === panel.name)?.context);
  }

  // Once a second, which is often enough that answering does not feel like waiting and seldom
  // enough to be free. A run asking for permission has stopped until it is answered, so there is
  // nothing else for the page to be doing meanwhile.
  //
  // Everything this asks for starts on the far side: a session asks to use a tool, a session is put
  // to work by another session or by this page in another window, and a session writes down what it
  // is on. None of it is something the page can know by having caused it.
  //
  // The room rides on this tick rather than having one of its own. It is built from the same rows
  // the panels were already being told about, so a room on the page is not a request per second per
  // person — it is nothing at all.
  const EVERY = 1000;

  async function look() {
    const { sessions } = await fetch("/sessions").then((response) => response.json());
    // The room first: it is the thing somebody is watching when they are not reading a panel.
    showTheRoom(sessions);
    const rows = new Map(sessions.map((session) => [session.name, session]));
    for (const panel of built) {
      const row = rows.get(panel.name);
      panel.busy(row?.busy === true);
      // On the same tick, because it changes for the same reason the busy sign does: a turn ended,
      // and this page need not have been the one that started it.
      panel.carrying(row?.context);
    }
  }

  setInterval(() => {
    for (const { waiting } of built) {
      waiting().catch(() => {
        // The chat is gone or restarting. The next tick will find out.
      });
    }
    look().catch(() => {});
  }, EVERY);
</script>
