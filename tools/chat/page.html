<!doctype html>
<meta charset="utf-8">
<title>Office workspace chat</title>

<h1 id="who">Chat</h1>

<div id="transcript"></div>

<form id="composer">
  <textarea id="message" rows="3" cols="80" placeholder="Write to the leader"></textarea>
  <button type="submit">Send</button>
</form>

<script type="module">
  // Deliberately plain. The point of this page is that a message can be typed and read back;
  // how it looks is a later question.
  const transcript = document.getElementById("transcript");
  const composer = document.getElementById("composer");
  const box = document.getElementById("message");

  const health = await fetch("/health").then((response) => response.json());
  document.getElementById("who").textContent = `${health.leader} — ${health.instance}`;

  async function show() {
    const { messages } = await fetch("/messages").then((response) => response.json());
    transcript.replaceChildren(
      ...messages.map((message) => {
        const line = document.createElement("p");
        const who = message.from === "human" ? health.human : health.leader;
        line.textContent = `${who}: ${message.text}`;
        return line;
      }),
    );
  }

  composer.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = box.value;
    if (text.trim() === "") {
      return;
    }
    box.value = "";
    await fetch("/message", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text }),
    });
    await show();
  });

  await show();
</script>
