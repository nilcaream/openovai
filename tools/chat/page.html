<!doctype html>
<meta charset="utf-8">
<!-- The page's own secret, filled in by the server on every load. Every request this page makes
     carries it, and the server answers nothing else. A bookmark or an installed app reopens this
     one plain address and gets the current secret again, so a server restart costs a reload and
     nothing more. -->
<meta name="openovai-secret" content="">
<title>OpenOv AI</title>

<h1 id="who"></h1>

<h2>The room</h2>
<div id="room"></div>

<div id="panels"></div>

<script type="module">
  // Deliberately plain. The point of this page is that every session in the instance can be
  // typed to and read back in one place; how it looks is a later question.

  import { dialogOf } from "./dialog.mjs";

  const secret = document.querySelector('meta[name="openovai-secret"]').content;

  // Every call to the server, with the page's secret on it. The server refuses a call without it
  // with 401, and a page that got one has been outlived by a server restart: reload and it has
  // the new secret.
  async function call(path, options = {}) {
    const answered = await fetch(path, {
      ...options,
      headers: { ...(options.headers ?? {}), authorization: `Bearer ${secret}` },
    });
    if (answered.status === 401) {
      location.reload();
      throw new Error("the server no longer knows this page");
    }
    return answered;
  }

  const atLoad = await call("/sessions").then((response) => response.json());
  const { user, leader, sessions } = atLoad;

  document.getElementById("who").textContent = `${leader}`;

  // What to call somebody on this page. The server writes the User's rows as `user`, so every
  // place a name is shown reads it back through here.
  function nameOf(from) {
    return from === "user" ? user : from;
  }

  // One line of a transcript. A line the User typed onto another panel says which one, so the
  // Leader's transcript reads as what the Leader was told.
  function said(message) {
    const line = document.createElement("p");
    const who = nameOf(message.from);
    const to = typeof message.typedTo === "string" ? ` to ${message.typedTo}` : "";
    const text = message.silent ? "(ended its turn without saying anything)" : message.text;
    line.textContent = `${who}${to}${message.failed ? " (failed)" : ""}: ${text}`;
    return line;
  }

  // The room: one line per seat, off the same rows the panels ask for.
  const room = document.getElementById("room");

  function showTheRoom({ sessions }) {
    room.replaceChildren(
      ...sessions.map((session) => {
        const line = document.createElement("p");
        line.textContent = `${session.name} — ${session.role}, ${session.model}, ${session.running ? "running" : "not running"}`;
        return line;
      }),
    );
  }

  // One panel per seat, built once from what the server said at load.
  const panels = document.getElementById("panels");

  function panel(session) {
    const section = document.createElement("section");
    const heading = document.createElement("h2");
    heading.textContent = session.name;

    const transcript = document.createElement("div");
    transcript.style.maxHeight = "24em";
    transcript.style.overflowY = "auto";

    const asking = document.createElement("div");

    const composer = document.createElement("form");
    const box = document.createElement("textarea");
    box.rows = 3;
    box.cols = 80;
    const send = document.createElement("button");
    send.type = "submit";
    send.textContent = "Send";
    composer.append(box, send);

    section.append(heading, transcript, asking, composer);

    // How many rows this panel has put on the screen. The transcript is append-only, so the
    // count is all a panel needs to tell a redraw worth doing from one that is not.
    let shown = -1;

    async function show() {
      const answered = await call(`/sessions/${session.name}/messages`);
      const { messages } = await answered.json();
      if (messages.length === shown) {
        return;
      }
      // At the newest line if that is where the reader already was, or on the first draw; otherwise
      // exactly where they left it.
      const atTheNewest = shown === -1 || transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 1;
      transcript.replaceChildren(...messages.map(said));
      shown = messages.length;
      if (atTheNewest) {
        transcript.scrollTop = transcript.scrollHeight;
      }
    }

    // A question on this panel: a call the session is stopped on, or a rule the Leader asks the
    // User to settle. What it shows is decided by dialogOf() — the words of the request and
    // nothing else — and drawn here with textContent, one line per field the request carried,
    // one button per decision that kind of question takes. A deny on a call stop needs a word
    // from the person, since the run is told why; a rule dialog carries the Leader's why already.
    function question(request) {
      const dialog = dialogOf(request, session.name);
      const line = document.createElement("p");
      const heading = document.createElement("span");
      heading.textContent = dialog.heading;
      line.append(heading);
      for (const { kind, text } of dialog.lines) {
        const shown = document.createElement(kind === "reason" || kind === "why" ? "q" : "code");
        shown.className = kind;
        shown.textContent = text;
        line.append(" ", shown);
      }

      const reason = dialog.kind === "call" ? document.createElement("input") : null;
      if (reason !== null) {
        reason.placeholder = "why not (needed to deny)";
        line.append(" ", reason);
      }

      const buttons = dialog.buttons.map(({ decision, label }) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.dataset.decision = decision;
        return button;
      });

      async function answer(body) {
        for (const button of buttons) {
          button.disabled = true;
        }
        await call(`/sessions/${session.name}/permission`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        await waiting();
      }

      for (const button of buttons) {
        const decision = button.dataset.decision;
        button.addEventListener("click", () => {
          if (decision === "deny" && reason !== null) {
            if (reason.value.trim() === "") {
              reason.focus();
              return;
            }
            answer({ id: request.id, decision, why: reason.value.trim() });
            return;
          }
          answer({ id: request.id, decision });
        });
        line.append(" ", button);
      }
      return line;
    }

    const drawn = new Map();

    async function waiting() {
      const answered = await call(`/sessions/${session.name}/permissions`);
      const { permissions } = await answered.json();
      for (const [id, line] of drawn) {
        if (!permissions.some((request) => request.id === id)) {
          line.remove();
          drawn.delete(id);
        }
      }
      for (const request of permissions) {
        if (!drawn.has(request.id)) {
          const line = question(request);
          drawn.set(request.id, line);
          asking.append(line);
        }
      }
    }

    // What is typed goes to the server as text and nothing else: the server knows it came from
    // this page by the secret on the call, and frames it as the User's own words.
    composer.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = box.value;
      if (text.trim() === "") {
        return;
      }
      box.value = "";
      await call(`/sessions/${session.name}/message`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      await show();
    });

    panels.append(section);
    return { name: session.name, show, waiting };
  }

  const built = sessions.map(panel);
  showTheRoom(atLoad);
  await Promise.all(built.map(({ show }) => show()));

  const EVERY = 1000;

  setInterval(() => {
    for (const { waiting, show } of built) {
      waiting().catch(() => {});
      show().catch(() => {});
    }
    call("/sessions")
      .then((response) => response.json())
      .then(showTheRoom)
      .catch(() => {});
  }, EVERY);
</script>
