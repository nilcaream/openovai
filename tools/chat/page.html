<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef1f5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/192.png">
<!-- The page's own secret, filled in by the server on every load. Every request this page makes
     carries it, and the server answers nothing else. A bookmark or an installed app reopens this
     one plain address and gets the current secret again, so a new server costs a reload and
     nothing more. -->
<meta name="openovai-secret" content="">
<title>OpenOv AI</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --panel-2: #eef1f5; --line: #d8dee4;
    --fg: #1f2328; --fg-dim: #59636e; --fg-faint: #848d97;
    --me: #d9fdd3; --me-line: #b7e8ae;
    --reply: #ffffff; --reply-line: #d8dee4;
    --from: #e3f0fc; --from-line: #b6d4f2;
    --to: #fde8e8; --to-line: #f0bcbc;
    --pending: #f0f3f6;
    --shadow: rgba(0,0,0,.35);
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #5eaeff;
    --radius: 8px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #161b22; --panel-2: #1c232d; --line: #262d38;
      --fg: #e6edf3; --fg-dim: #9aa7b4; --fg-faint: #6b7783;
      --me: #1f4f3a; --me-line: #2d6b4f;
      --reply: #1c232d; --reply-line: #2a3341;
      --from: #1a2a3d; --from-line: #2b4a6d;
      --to: #3a2226; --to-line: #6b3a42;
      --pending: #22272e;
      --shadow: rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { font-size: 16px; }
  body {
    background: var(--bg); color: var(--fg); font: 1rem/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh;
  }
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  a { color: var(--accent); }
  #status { margin: 0; padding: 4px 8px; font-size: 12px; color: var(--fg-dim); border-bottom: 1px solid var(--line); }
  #stage {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1092px) minmax(0, 1fr);
  }
  .col { min-height: 0; display: flex; flex-direction: column; gap: 4px; padding: 4px; overflow-y: auto; }
  .col:empty { padding: 0; }
  @media (max-width: 900px) {
    #stage { grid-template-columns: minmax(0, 1fr); }
    #mid { order: 0; }
    #left { order: 1; }
    #right { order: 2; }
  }
  /* a panel is a bare slot: the head bubble first, then the rows */
  .panel { flex: 1 1 0; min-height: 160px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; font-size: .9rem; transition: opacity .4s; }
  #mid .panel { flex: 1 1 auto; }
  .panel.dimmed { opacity: .45; }
  .phead {
    flex: 0 0 auto; padding: 4px 10px 3px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--panel-2);
    display: flex; align-items: baseline; gap: 0; min-width: 0; overflow: hidden; white-space: nowrap;
  }
  .panel.asking .phead { border-color: var(--warn); }
  .phead .name { margin-right: 8px; flex: 0 0 auto; white-space: nowrap; font-weight: 700; font-size: 1rem; }
  /* the dot before the name: red once the process is gone, pulsing while the panel asks */
  .phead .name::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-faint); margin-right: 8px; vertical-align: 1px; }
  .panel.dimmed .phead .name::before { background: var(--bad); }
  .panel.asking .phead .name::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  /* the facts never shrink; the state word is the one part the row may trim */
  .phead .info { font-family: var(--mono); font-size: .78rem; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; }
  .phead .state { color: var(--fg-dim); font-size: .78rem; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
  .phead .info:not(:empty) + .state:not(:empty)::before { content: "\00a0·\00a0"; }
  .phead button { font: .74rem var(--mono); color: var(--bad); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; cursor: pointer; flex: 0 0 auto; margin-left: 10px; align-self: center; }
  .phead button:hover { color: var(--fg); border-color: var(--fg-faint); }
  .phead button:disabled { opacity: .45; cursor: default; }
  .rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0; }
  .rows .empty { color: var(--fg-faint); font-size: .8rem; padding: 4px 0; }
  #mid .rows .empty { font-size: inherit; text-align: center; padding: 20px 0; }
  /* a row is a bubble: the label row on top, the body under it; the kind of the row picks its ground */
  .msg { display: flex; margin: 4px 0; }
  .bubble { width: 100%; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px 4px; background: var(--panel-2); position: relative; min-width: 120px; }
  .msg.user .bubble { background: var(--me); border-color: var(--me-line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.reply .bubble { background: var(--reply); border-color: var(--reply-line); }
  .msg.chat .bubble, .msg.silent .bubble { color: var(--fg-dim); }
  .msg.interrupted .bubble { background: var(--pending); border-style: dashed; color: var(--fg-dim); }
  .msg.failed .bubble { border-color: var(--bad); }
  .text { white-space: pre-wrap; }
  /* the label row: the speaker on the left, ellipsised before it could push the timestamp, the timestamp last */
  .who { font-size: .78rem; font-weight: 600; color: var(--fg-dim); display: flex; gap: 8px; align-items: baseline; margin-right: auto; flex: 1 1 auto; min-width: 0; }
  .who .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: .72rem; color: var(--fg-faint); text-align: right; margin: 0 0 3px; font-family: var(--mono); display: flex; gap: 8px; justify-content: flex-end; align-items: baseline; }
  .meta .t { flex: 0 0 auto; order: 1; }
  /* the pill between two days */
  .divider { text-align: center; margin: 14px 0; color: var(--fg-faint); font-size: .78rem; font-family: var(--mono); }
  .divider span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; }
  /* markdown inside a reply */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: .45em 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: .7em 0 .3em; line-height: 1.25; }
  .md h1 { font-size: 1.25rem; } .md h2 { font-size: 1.15rem; } .md h3 { font-size: 1.05rem; } .md h4 { font-size: 1rem; }
  .md code { font-family: var(--mono); font-size: .88em; background: rgba(127,127,127,.18); padding: .1em .35em; border-radius: 5px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; font-size: .85rem; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; font-size: .92rem; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel); }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--fg-dim); }
  .md a, .bubble a { color: var(--accent); }
  .md ul, .md ol { padding-left: 1.2em; }
  .md li { margin: .1em 0; }
  .md li > p { margin: .15em 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); }
  .md img { max-width: 100%; }
  /* the questions box, a child of the panel: the panel itself carries the asking class too */
  .panel > .asking:not(:empty) { padding: 4px 8px; border-top: 1px solid var(--line); }
  .panel > .asking p { margin: 4px 0; }
  .panel > .asking code, .panel > .asking q { display: block; margin: 2px 0; }
  .panel > .asking input { font: inherit; }
  .panel > .asking button { font: inherit; margin-right: 4px; }
  .composer { padding: 6px 8px; border-top: 1px solid var(--line); }
  .composer textarea { width: 100%; resize: vertical; font: inherit; }
</style>

<p id="status"></p>
<div id="stage">
  <div class="col" id="left"></div>
  <div class="col" id="mid"></div>
  <div class="col" id="right"></div>
</div>

<script type="module">
  // Everything in this instance in one place: the Leader in the middle, the Workers beside it,
  // each panel a process. What to show is decided in panels.mjs and render.mjs; this script
  // draws it and carries what is typed and pressed to the server.

  import { dialogOf } from "./dialog.mjs";
  import { applyEvent, composersEnabled, fresh, head, keyAction, place, prune, statusLine, stopEnabled, title } from "./panels.mjs";
  import { row as rowOf } from "./render.mjs";

  const secret = document.querySelector('meta[name="openovai-secret"]').content;

  // Every call to the server, with the page's secret on it. The server refuses a call without it
  // with 401, and a page that got one has been outlived by its server: reload and it has the
  // new secret. A 503 is the instance stopping: nothing is typed into it from here on.
  async function call(path, options = {}) {
    const answered = await fetch(path, {
      ...options,
      headers: { ...(options.headers ?? {}), authorization: `Bearer ${secret}` },
    });
    if (answered.status === 401) {
      location.reload();
      throw new Error("the server no longer knows this page");
    }
    if (answered.status === 503) {
      applyEvent(state, { name: "stopping", data: {} });
      draw();
    }
    return answered;
  }

  const state = fresh();
  const health = await call("/health").then((response) => response.json());
  const status = document.getElementById("status");
  const columns = { left: document.getElementById("left"), mid: document.getElementById("mid"), right: document.getElementById("right") };

  // ------------------------------------------------------------------------------- one panel

  const sections = new Map();

  function build(name) {
    const section = document.createElement("section");
    section.className = "panel";

    const headLine = document.createElement("div");
    headLine.className = "phead";
    const nameLine = document.createElement("span");
    nameLine.className = "name";
    const info = document.createElement("span");
    info.className = "info";
    const word = document.createElement("span");
    word.className = "state";
    const stop = document.createElement("button");
    stop.type = "button";
    stop.textContent = "STOP";
    stop.addEventListener("click", () => {
      stop.disabled = true;
      call(`/sessions/${encodeURIComponent(name)}/stop`, { method: "POST" }).catch(() => {});
    });
    headLine.append(nameLine, info, word, stop);

    const rows = document.createElement("div");
    rows.className = "rows";
    // What a panel says until its first row: while the rows are still on their way, and while
    // there are none.
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Waiting for the transcript…";
    rows.append(empty);
    const asking = document.createElement("div");
    asking.className = "asking";

    const composer = document.createElement("form");
    composer.className = "composer";
    const box = document.createElement("textarea");
    box.rows = 3;
    box.addEventListener("keydown", (event) => {
      if (keyAction(event) === "send") {
        event.preventDefault();
        composer.requestSubmit();
      }
    });
    composer.append(box);
    // What is typed goes to the server as text and nothing else: the server knows it came from
    // this page by the secret on the call, and frames it as the User's own words.
    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = box.value;
      if (text.trim() === "") {
        return;
      }
      box.value = "";
      call(`/sessions/${encodeURIComponent(name)}/message`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      }).catch(() => {});
    });

    section.append(headLine, rows, asking, composer);
    return { name, section, nameLine, info, word, stop, rows, empty, asking, box, shown: 0, day: null, drawn: new Map(), loading: false };
  }

  // When a row was written, in the reader's own zone: `2026.09.13 Sunday 23:17:05` on the row, and
  // `Sun 13 Sept` on the pill between two days.
  const timeOf = new Intl.DateTimeFormat("en-GB", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "long", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  const dayOf = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "2-digit", month: "short" });

  function stamp(at) {
    if (at === undefined) return "";
    const part = Object.fromEntries(timeOf.formatToParts(new Date(at)).map((piece) => [piece.type, piece.value]));
    return `${part.year}.${part.month}.${part.day} ${part.weekday} ${part.hour}:${part.minute}:${part.second}`;
  }

  function dayPill(day) {
    const pill = document.createElement("div");
    pill.className = "divider";
    const text = document.createElement("span");
    text.textContent = day;
    pill.append(text);
    return pill;
  }

  // A row is a bubble: the label row on top — who spoke, and when, last — and the body under it,
  // the HTML of a reply or the words of anyone else as they are.
  function rowElement(entry) {
    const shown = rowOf(entry, { chat: state.chat });
    const line = document.createElement("div");
    line.className = `msg ${shown.kind}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const meta = document.createElement("div");
    meta.className = "meta";
    const who = document.createElement("div");
    who.className = "who";
    const label = document.createElement("span");
    label.className = "lbl";
    label.textContent = shown.who;
    who.append(label);
    const time = document.createElement("span");
    time.className = "t";
    time.textContent = stamp(entry.at);
    meta.append(who, time);
    const body = document.createElement("div");
    if (shown.html !== undefined) {
      body.className = "md";
      body.innerHTML = shown.html;
    } else {
      body.className = "text";
      body.textContent = shown.text;
    }
    bubble.append(meta, body);
    line.append(bubble);
    return line;
  }

  // A question on this panel: a call the session is stopped on, or a rule the Leader asks the
  // User to settle. What it shows is decided by dialogOf() — the words of the request and
  // nothing else — and drawn here with textContent, one line per field the request carried,
  // one button per decision that kind of question takes. A deny on a call stop needs a word
  // from the person, since the run is told why; a rule dialog carries the Leader's why already.
  function question(name, request) {
    const dialog = dialogOf(request, name);
    const line = document.createElement("p");
    const heading = document.createElement("span");
    heading.textContent = dialog.heading;
    line.append(heading);
    for (const { kind, text } of dialog.lines) {
      const shown = document.createElement(kind === "reason" || kind === "why" ? "q" : "code");
      shown.className = kind;
      shown.textContent = text;
      line.append(" ", shown);
    }

    const reason = dialog.kind === "call" ? document.createElement("input") : null;
    if (reason !== null) {
      reason.placeholder = "why not (needed to deny)";
      line.append(" ", reason);
    }

    const buttons = dialog.buttons.map(({ decision, label }) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.dataset.decision = decision;
      return button;
    });

    function answer(body) {
      for (const button of buttons) {
        button.disabled = true;
      }
      call(`/sessions/${encodeURIComponent(name)}/permission`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      }).catch(() => {});
    }

    for (const button of buttons) {
      const decision = button.dataset.decision;
      button.addEventListener("click", () => {
        if (decision === "deny" && reason !== null) {
          if (reason.value.trim() === "") {
            reason.focus();
            return;
          }
          answer({ id: request.id, decision, why: reason.value.trim() });
          return;
        }
        answer({ id: request.id, decision });
      });
      line.append(" ", button);
    }
    return line;
  }

  // A panel made from a later event has no rows yet: they are asked for once, and arrive as
  // the rows of a stream do.
  function load(panel) {
    if (panel.loading) {
      return;
    }
    panel.loading = true;
    call(`/sessions/${encodeURIComponent(panel.name)}/messages`)
      .then((response) => response.json())
      .then(({ messages }) => {
        applyEvent(state, { name: "rows", data: { seat: panel.name, since: 0, rows: messages } });
        panel.loading = false;
        draw();
      })
      .catch(() => {
        panel.loading = false;
      });
  }

  function drawPanel(panel) {
    const about = state.panels[panel.name];
    const parts = head(state, panel.name);
    panel.nameLine.textContent = parts.name;
    panel.info.textContent = parts.info;
    panel.word.textContent = parts.state;
    panel.section.title = about.title;
    panel.section.classList.toggle("dimmed", about.dimmed);
    panel.section.classList.toggle("asking", about.asking.length > 0);
    panel.stop.disabled = !stopEnabled(state, panel.name);
    panel.box.disabled = !composersEnabled(state, panel.name);

    if (about.rows === null) {
      load(panel);
    } else {
      // At the newest line if that is where the reader already was, or on the first draw;
      // otherwise exactly where they left it.
      const atTheNewest = panel.shown === 0 || panel.rows.scrollHeight - panel.rows.scrollTop - panel.rows.clientHeight < 1;
      if (about.rows.length < panel.shown) {
        panel.rows.replaceChildren(panel.empty);
        panel.shown = 0;
        panel.day = null;
      }
      panel.empty.hidden = about.rows.length > 0;
      if (about.rows.length > panel.shown) {
        // A pill names the day before the first row written on it.
        for (const entry of about.rows.slice(panel.shown)) {
          const day = entry.at === undefined ? panel.day : dayOf.format(new Date(entry.at));
          if (day !== panel.day) {
            panel.day = day;
            panel.rows.append(dayPill(day));
          }
          panel.rows.append(rowElement(entry));
        }
        panel.shown = about.rows.length;
        if (atTheNewest) {
          panel.rows.scrollTop = panel.rows.scrollHeight;
        }
      }
    }

    for (const [id, line] of panel.drawn) {
      if (!about.asking.some((request) => request.id === id)) {
        line.remove();
        panel.drawn.delete(id);
      }
    }
    for (const request of about.asking) {
      if (!panel.drawn.has(request.id)) {
        const line = question(panel.name, request);
        panel.drawn.set(request.id, line);
        panel.asking.append(line);
      }
    }
  }

  // ------------------------------------------------------------------------------- the page

  function draw() {
    for (const name of Object.keys(state.panels)) {
      if (!sections.has(name)) {
        sections.set(name, build(name));
      }
    }
    for (const [name, panel] of sections) {
      if (state.panels[name] === undefined) {
        panel.section.remove();
        sections.delete(name);
      }
    }
    const placed = place([...sections.keys()], state.leader, state.order);
    for (const [side, names] of [["left", placed.left], ["mid", [placed.mid]], ["right", placed.right]]) {
      const wanted = names.filter((name) => sections.has(name)).map((name) => sections.get(name).section);
      if (wanted.some((section, at) => columns[side].children[at] !== section) || columns[side].children.length !== wanted.length) {
        columns[side].replaceChildren(...wanted);
      }
    }
    for (const panel of sections.values()) {
      drawPanel(panel);
    }
    status.textContent = statusLine(health, state, state.connection);
    document.title = title(state);
  }

  // One stream from the server: what to draw first, then everything as it happens. The page
  // connects again itself when the stream drops, with the counts it has, so nothing arrives
  // twice and nothing is missed; the secret rides on the address, since the stream carries no
  // header.
  const EVENTS = ["snapshot", "rows", "row", "asking", "seat", "standing", "stopping"];
  let stream = null;

  function connect() {
    const since = Object.values(state.panels)
      .filter((panel) => panel.rows !== null)
      .map((panel) => `&since=${encodeURIComponent(`${panel.name}:${panel.rows.length}`)}`)
      .join("");
    stream = new EventSource(`/events?page=${encodeURIComponent(secret)}${since}`);
    for (const name of EVENTS) {
      stream.addEventListener(name, (event) => {
        applyEvent(state, { name, data: JSON.parse(event.data) });
        draw();
      });
    }
    stream.addEventListener("open", () => {
      if (state.connection !== "stopping") {
        state.connection = "connected";
        draw();
      }
    });
    stream.addEventListener("error", () => {
      stream.close();
      if (state.connection !== "stopping") {
        state.connection = "reconnecting…";
        draw();
      }
      // A stream that will not open is asked about once: a 401 means a new server and a new
      // secret (reload, in call), a 503 the instance stopping; anything else, try again.
      setTimeout(() => call("/sessions").then((answered) => (answered.status === 503 ? undefined : connect()), connect), 1000);
    });
  }

  connect();
  setInterval(() => {
    if (prune(state, Date.now()).length > 0) {
      draw();
    }
  }, 1000);
</script>
