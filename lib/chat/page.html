<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef1f5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/192.png">
<!-- The page's own secret, filled in by the server on every load. Every request this page makes
     carries it, and the server answers nothing else. A bookmark or an installed app reopens this
     one plain address and gets the current secret again, so a new server costs a reload and
     nothing more. -->
<meta name="openovai-secret" content="">
<title>OpenOv AI</title>
<script>
  // The theme before the first paint, so a page kept dark never flashes light: the stored choice,
  // light when there is none or when storage throws. It sits above the stylesheet on purpose.
  try { document.documentElement.dataset.theme = localStorage.getItem("openovai-theme") === "dark" ? "dark" : "light"; }
  catch (error) { document.documentElement.dataset.theme = "light"; }
</script>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --panel-2: #eef1f5; --line: #d8dee4;
    --fg: #1f2328; --fg-dim: #59636e; --fg-faint: #848d97;
    --me: #d9fdd3; --me-line: #b7e8ae;
    --reply: #ffffff; --reply-line: #d8dee4;
    --from: #e3f0fc; --from-line: #b6d4f2;
    --to: #fde8e8; --to-line: #f0bcbc;
    --typed: #fdf0dc; --typed-line: #f0d3a0;
    --pending: #f0f3f6;
    --shadow: rgba(0,0,0,.35);
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #5eaeff;
    --radius: 8px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  /* dark is a choice made on the page and kept by it, never read off the system */
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c232d; --line: #262d38;
    --fg: #e6edf3; --fg-dim: #9aa7b4; --fg-faint: #6b7783;
    --me: #1f4f3a; --me-line: #2d6b4f;
    --reply: #1c232d; --reply-line: #2a3341;
    --from: #203349; --from-line: #2b4a6d;
    --to: #3a2226; --to-line: #6b3a42;
    --typed: #3a2e1c; --typed-line: #6b5230;
    --pending: #22272e;
    --shadow: rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; scrollbar-width: none; }
  html, body { margin: 0; height: 100%; }
  html { font-size: 16px; }
  body {
    background: var(--bg); color: var(--fg); font: 1rem/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh;
  }
  *::-webkit-scrollbar { display: none; }
  a { color: var(--accent); }
  /* three columns: the Leader's in the middle, up to 1092px; the Workers' either side, 406px at
     the least and sharing the rest — so a narrower window takes from the middle, not the sides */
  #stage {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(406px, 1fr) minmax(0, 1092px) minmax(406px, 1fr);
  }
  .col { min-height: 0; display: flex; flex-direction: column; gap: 4px; padding: 4px; overflow-y: auto; }
  .col:empty { padding: 0; }
  @media (max-width: 900px) {
    #stage { grid-template-columns: minmax(0, 1fr); }
    #mid { order: 0; }
    #left { order: 1; }
    #right { order: 2; }
  }
  /* a panel is a bare slot: the head bubble first, then the rows, then the bottom area */
  .panel { flex: 1 1 0; min-height: 160px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; font-size: .9rem; transition: opacity .4s; }
  #mid .panel { flex: 1 1 auto; }
  .panel.dimmed { opacity: .45; }
  .phead {
    flex: 0 0 auto; padding: 4px 10px 3px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--panel-2);
    display: flex; align-items: baseline; gap: 0; min-width: 0; overflow: hidden; white-space: nowrap;
  }
  .panel.asking .phead { border-color: var(--warn); }
  /* a head that follows its newest row carries the left border of a clickable line; the padding gives back the border's extra px, so nothing moves */
  .phead.follow { border-left: 3px solid var(--accent); padding-left: 9px; }
  .phead .name { margin-right: 8px; flex: 0 0 auto; white-space: nowrap; font-weight: 700; font-size: 1rem; }
  /* the dot before the name: green while the panel listens, amber while its turn runs, red once the process is gone or the page has no stream, pulsing while the panel asks */
  .phead .name::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-faint); margin-right: 8px; vertical-align: 1px; }
  .panel.idle .phead .name::before { background: var(--ok); }
  .panel.busy .phead .name::before { background: var(--warn); }
  .panel.gone .phead .name::before { background: var(--bad); }
  .panel.asking .phead .name::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  /* Every word on a head is pinned: nothing shrinks, nothing is hidden, and a head too narrow for
     all of them clips at its right edge — the context is never the part that goes. */
  .phead .info { font-family: var(--mono); font-size: .78rem; color: var(--fg-dim); white-space: nowrap; flex: 0 0 auto; }
  .phead .state { color: var(--fg-dim); font-size: .78rem; font-family: var(--mono); white-space: nowrap; flex: 0 0 auto; }
  .phead .info:not(:empty) + .state:not(:empty)::before { content: "\00a0·\00a0"; }
  /* on the Leader's head only: the connection word, red while the page has no stream, and the
     account's usage windows */
  .phead .conn, .phead .quota { font-family: var(--mono); font-size: .78rem; color: var(--fg-dim); white-space: nowrap; flex: 0 0 auto; }
  .phead .conn::before, .phead .quota:not(:empty)::before { content: "\00a0·\00a0"; }
  .phead .conn.off { color: var(--bad); }
  /* the theme toggle, last on the Leader's head and pushed to its right edge: one icon button
     showing the theme that is on; both icons are in the DOM and the theme picks the one drawn */
  .phead .theme { margin-left: auto; align-self: center; flex: 0 0 auto; width: 22px; height: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; color: var(--fg-dim); background: none; cursor: pointer; }
  .phead .theme:hover { color: var(--fg); background: var(--line); }
  .phead .theme svg { width: 15px; height: 15px; display: block; }
  .phead .theme .moon { display: none; }
  :root[data-theme="dark"] .phead .theme .sun { display: none; }
  :root[data-theme="dark"] .phead .theme .moon { display: block; }
  /* the two notification switches after the theme toggle, in its style: one icon button each, lit
     while on, the same icon with a slash across it while off; both drawings are in the DOM and the
     switch's state picks the one drawn */
  .phead .notify { margin-left: 4px; align-self: center; flex: 0 0 auto; width: 22px; height: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; color: var(--fg-faint); background: none; cursor: pointer; }
  .phead .notify:hover { color: var(--fg); background: var(--line); }
  .phead .notify.on { color: var(--fg); }
  .phead .notify svg { width: 15px; height: 15px; display: block; }
  .phead .notify .lit { display: none; }
  .phead .notify.on .lit { display: block; }
  .phead .notify.on .slashed { display: none; }
  /* the pill that says rows arrived below where the reader is, on the Leader's panel */
  #jump { position: sticky; left: 50%; transform: translateX(-50%); bottom: 24px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 6px 14px; font-size: .85rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow); display: none; }
  #jump.show { display: block; }
  /* the rows take the focus on a click, so the keys scroll them; no ring for it, the head's border says what the keys do */
  .rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0; outline: none; }
  /* a tool call is a light line: one per call, no label, no stamp */
  .rows .line { display: block; width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); font-family: var(--mono); font-size: .76rem; color: var(--fg-dim); padding: 3px 8px; margin: 3px 0; overflow-wrap: anywhere; }
  .rows .line.err { color: var(--bad); }
  .rows .line .n { color: var(--fg-faint); }
  /* a line that is one end of a message between two sessions: a click on it finds the message on the Leader's panel */
  .rows .line.peer { cursor: pointer; border-left: 3px solid var(--accent); }
  /* the one line that says what the seat is at: always exactly one line, cut with an ellipsis */
  .rows .line.doing { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* a row is a bubble: the label row on top, the body under it; the kind of the row picks its ground */
  .msg { display: flex; margin: 4px 0; }
  .bubble { width: 100%; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px 4px; background: var(--panel-2); position: relative; min-width: 120px; }
  .msg.user .bubble { background: var(--me); border-color: var(--me-line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.reply .bubble { background: var(--reply); border-color: var(--reply-line); }
  .msg.chat .bubble, .msg.silent .bubble { color: var(--fg-dim); }
  .msg.interrupted .bubble { background: var(--pending); border-style: dashed; color: var(--fg-dim); }
  /* what the User typed, until the process has it: a waiting ground, dashed */
  .msg.pending .bubble { background: var(--pending); border-style: dashed; color: var(--fg-dim); }
  .msg.failed .bubble { border-color: var(--bad); }
  /* a message between two sessions on the Leader's panel: one ground for what went to a session, another for what came from one;
     a folded row with something under its fold — marked so once it is measured on the page — carries the pointer */
  .msg.foldable { cursor: pointer; }
  .msg.peer-in .bubble, .msg.peer-out .bubble { overflow-wrap: anywhere; }
  .msg.peer-in .bubble { background: var(--from); border-color: var(--from-line); }
  .msg.peer-out .bubble { background: var(--to); border-color: var(--to-line); }
  /* what the User typed to a Worker, on the Leader's panel: the User's own prompt, so the User's ground under the `<User> → <Worker>` label */
  .msg.typed .bubble { background: var(--me); border-color: var(--me-line); white-space: pre-wrap; overflow-wrap: anywhere; }
  /* what one Worker said to another, on the Leader's panel: not a prompt to the Leader and not the User's words, so a ground of its
     own; its body is markdown like To and From, so no pre-wrap here — it would draw the markup's own newlines as blank lines */
  .msg.overheard .bubble { background: var(--typed); border-color: var(--typed-line); overflow-wrap: anywhere; }
  /* the message a click on a line found, lit for a moment */
  .msg.focus .bubble { outline: 2px solid var(--accent); }
  /* a message between sessions — to one, from one, or between two Workers — is one line of its markdown, cut with an ellipsis, until a double click opens it */
  .msg.collapsed .md, .msg.collapsed .text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; }
  /* a folded message whose markdown opens with something other than a paragraph — a table, a list, a code block, a heading,
     a quote, a rule — has no first line the clamp could show (a table clamped drew whole): its fold shows a placeholder in
     the meta's style in place of the body, and a double click opens the whole rendered markdown as on any other row */
  .msg .fold { display: none; font-size: .72rem; color: var(--fg-faint); font-family: var(--mono); }
  .msg.collapsed.placeholder .md { display: none; }
  .msg.collapsed.placeholder .fold { display: block; }
  /* a plain body wraps anywhere: one unbreakable token — a URL, a path — would otherwise run past the bubble and give the page a sideways scrollbar */
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  /* the label row: the speaker on the left, ellipsised before it could push the timestamp, the timestamp last */
  .who { font-size: .78rem; font-weight: 600; color: var(--fg-dim); display: flex; gap: 8px; align-items: baseline; margin-right: auto; flex: 1 1 auto; min-width: 0; }
  .who .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the words beside the label while the User's row waits: small, faint, in the mono of a machine word */
  .who .tag { font-weight: 400; color: var(--fg-faint); font-family: var(--mono); font-size: .72rem; }
  .meta { font-size: .72rem; color: var(--fg-faint); text-align: right; margin: 0 0 3px; font-family: var(--mono); display: flex; gap: 8px; justify-content: flex-end; align-items: baseline; }
  /* the stamp is a click: it points at the row from the composer */
  .meta .t { flex: 0 0 auto; order: 1; cursor: pointer; }
  .meta .t:hover { color: var(--fg); text-decoration: underline dotted; }
  /* what became of a message the Leader sent, or of the User's own once it went in: a glyph before the stamp, red when it did not go */
  .meta .st { flex: 0 0 auto; color: var(--ok); }
  .meta .st.bad { color: var(--bad); }
  /* the pill between two days */
  .divider { text-align: center; margin: 14px 0; color: var(--fg-faint); font-size: .78rem; font-family: var(--mono); }
  .divider span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; }
  /* markdown inside a reply */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: .45em 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: .7em 0 .3em; line-height: 1.25; }
  .md h1 { font-size: 1.25rem; } .md h2 { font-size: 1.15rem; } .md h3 { font-size: 1.05rem; } .md h4 { font-size: 1rem; }
  .md code { font-family: var(--mono); font-size: .88em; background: rgba(127,127,127,.18); padding: .1em .35em; border-radius: 5px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: .85rem; line-height: 1.4; position: relative; }
  .md pre code { background: none; padding: 0; font-size: inherit; }
  /* the copy button in a code block's top-right corner: there on hover, on focus and while it
     says copied — the tick in place of the clipboard, in the ok colour, for a moment */
  .md pre .copy { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--fg-dim); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .md pre:hover .copy, .md pre .copy:focus-visible, .md pre .copy.copied { opacity: 1; }
  .md pre .copy.copied { color: var(--ok); }
  .md pre .copy svg { width: 14px; height: 14px; }
  .md pre .copy .tick, .md pre .copy.copied .clip { display: none; }
  .md pre .copy.copied .tick { display: inline; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; font-size: .92rem; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel); }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--fg-dim); }
  .md a, .bubble a { color: var(--accent); }
  .md ul, .md ol { padding-left: 1.2em; }
  .md li { margin: .1em 0; }
  .md li > p { margin: .15em 0; }
  /* the compact form, for a message between two sessions */
  .md.tight p, .md.tight ul, .md.tight ol, .md.tight li, .md.tight li > p, .md.tight pre { margin: 0; }
  .md.tight ul, .md.tight ol { padding-left: 1.1em; }
  .md hr { border: 0; border-top: 1px solid var(--line); }
  .md img { max-width: 100%; }
  /* the bottom area of a panel: the cards of its questions, then the composer. It takes its room
     from the rows in the panel's column — never over them — and no more than most of the panel,
     so a stack of cards scrolls inside it while the composer stays in sight */
  .bottom { flex: 0 0 auto; max-height: 75%; display: flex; flex-direction: column; gap: 3px; }
  .cards { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  /* a question is a card in the bottom area, right above the composer: the heading, the raw words of the request, the reason, then the decisions */
  .msg.perm .bubble { background: var(--panel-2); border-color: var(--warn); border-width: 2px; }
  .msg.perm .desc { font-size: .92rem; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .msg.perm .reason { font-size: .78rem; color: var(--fg-dim); font-family: var(--mono); margin: 0 0 4px; }
  .msg.perm .raw { font-family: var(--mono); font-size: .76rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 18em; overflow: auto; }
  .msg.perm .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 2px; }
  .msg.perm .acts button { font: 600 .82rem var(--sans); padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  .msg.perm .acts button[data-decision=allow], .msg.perm .acts button[data-decision=answer] { background: var(--me); border-color: var(--me-line); }
  /* the questions of one card, a rule between each and the next; an option's button in a column of
     its own, its words wrapping under themselves and never under the button; Other's field the
     whole width of that column */
  .msg.perm .choice + .choice { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
  .msg.perm .choice label { display: grid; grid-template-columns: auto 1fr; column-gap: .4em; align-items: baseline; }
  .msg.perm .choice input[type=text] { width: 100%; margin: 4px 0; font: .82rem var(--sans); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .msg.perm .acts button[data-decision=deny] { background: var(--to); border-color: var(--to-line); }
  .msg.perm .acts input { flex: 1 1 200px; min-width: 120px; font: .82rem var(--sans); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  /* the composer: one row that grows with what is typed, never dragged, up to 40% of the window */
  .composer { flex: 0 0 auto; min-height: 0; padding: 0; position: relative; }
  textarea { display: block; width: 100%; resize: none; min-height: 40px; max-height: 40vh; padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; line-height: 1.5; outline: none; overflow-y: hidden; }
  textarea:focus { border-color: var(--accent); }
  textarea:disabled { opacity: .55; }
  /* the stop glyph, over the right edge of the box while a turn can be stopped and gone otherwise:
     out of the flow, so the box and the room for what is typed are the same width with it and
     without it; on the box's own ground with a 2px ring of it, so it reads over letters under it */
  .composer .stop { position: absolute; right: 9px; bottom: 9px; width: 22px; height: 22px; padding: 4px; border: 0; border-radius: 6px; background: var(--bg); box-shadow: 0 0 0 2px var(--bg); color: var(--fg-dim); cursor: pointer; }
  .composer .stop:hover { color: var(--fg); background: var(--line); }
  .composer .stop svg { width: 14px; height: 14px; display: block; }
</style>

<div id="stage">
  <div class="col" id="left"></div>
  <div class="col" id="mid"></div>
  <div class="col" id="right"></div>
</div>

<script type="module">
  // Everything in this instance in one place: the Leader in the middle, the Workers beside it,
  // each panel a process. What to show is decided in panels.mjs and render.mjs; this script
  // draws it and carries what is typed and pressed to the server.

  import { answerOf, dialogOf } from "./dialog.mjs";
  import { AMBER, CARD, CONNECTED, DISCONNECTED, GREEN, RED, REPLY, advance, anyAsking, applyEvent, composersEnabled, delivery, dot, following, fresh, head, keyAction, noticed, place, prune, quotaLine, quotaTitle, reference, spellReferences, stopEnabled, title, typedAgainst, typingBeat } from "./panels.mjs";
  import { collapsed, dayPillBefore, row as rowOf } from "./render.mjs";

  const secret = document.querySelector('meta[name="openovai-secret"]').content;

  // The theme: the head script above <style> applied the stored choice before the first paint;
  // this owns the click and keeps the rest in step — the choice stored under one key, the
  // toggle's title, and the theme-color meta repainted from the head bubble's ground so an
  // installed app's title bar follows. Storage can throw (blocked site data): then the theme is
  // still applied, only not remembered.
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  let themeToggle = null;
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem("openovai-theme", theme); } catch (error) {}
    if (themeToggle !== null) themeToggle.title = theme === "dark" ? "Dark — click for light" : "Light — click for dark";
    themeMeta.content = getComputedStyle(document.documentElement).getPropertyValue("--panel-2").trim() || themeMeta.content;
  }
  applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");

  // Reaching a reader who is not at the page: a browser notification, through the browser's own
  // system, for a card appearing on any panel and for the Leader's reply arriving — what
  // panels.mjs reads off an event. Never while the page is visible, since a page in front of the reader tells
  // them itself; never with its switch off; never without the browser's permission, which is the
  // browser's to ask and to keep. One per panel at a time: the tag is the seat, so a burst on one
  // panel replaces its own rather than stacking. A click brings the page to the front and the panel
  // it came from into view. No sound of the page's own — the browser and the system do what they
  // do with a notification.
  //
  // Two switches, on the Leader's head after the theme toggle, are the whole of the configuration:
  // one for the action-needed notification, one for the end-of-turn notification, each off until
  // the browser's storage says on — off when the storage says anything else, and off when there is
  // no storage to ask. Each is an icon button in the theme toggle's style: an exclamation mark in
  // a circle for the first, a bell for the second, lit while on and slashed across while off, the
  // tooltip saying which. The browser's own permission is asked from the click that turns a switch
  // on, as browsers require, and from nowhere else; and the switch lights only once the browser
  // has granted it — a prompt refused or dismissed, a browser that refused before, or a browser
  // with no notifications at all leaves the switch off, so the icon never claims what the browser
  // will not do.
  const ALERT = '<svg class="lit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>';
  const ALERT_SLASHED = '<svg class="slashed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.3 5.3A9.5 9.5 0 0 0 18.7 18.7M8.3 3.2a9.5 9.5 0 0 1 12.5 12.5M12 7.5v5.5M12 16.5h.01M3 3l18 18"/></svg>';
  const BELL = '<svg class="lit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>';
  const BELL_SLASHED = '<svg class="slashed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.73 21a2 2 0 0 1-3.46 0M18.63 13A17.89 17.89 0 0 1 18 8M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.33-5M1 1l22 22"/></svg>';
  const NOTIFY = {
    [CARD]: { key: "openovai-notify-action", label: "Action-needed notifications", icons: ALERT + ALERT_SLASHED, on: "Notifying when someone requires your action while this page is not visible — click to stop", off: "Not notifying when someone requires your action — click to start" },
    [REPLY]: { key: "openovai-notify-turn", label: "End-of-turn notifications", icons: BELL + BELL_SLASHED, on: "Notifying when the Leader finishes a turn while this page is not visible — click to stop", off: "Not notifying when the Leader finishes a turn — click to start" },
  };
  function notifyOn(kind) {
    try { return localStorage.getItem(NOTIFY[kind].key) === "on"; } catch (error) { return false; }
  }
  function notifySwitch(kind) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "notify";
    button.setAttribute("aria-label", NOTIFY[kind].label);
    button.innerHTML = NOTIFY[kind].icons;
    const show = () => {
      const on = notifyOn(kind);
      button.classList.toggle("on", on);
      button.title = on ? NOTIFY[kind].on : NOTIFY[kind].off;
    };
    button.addEventListener("click", async () => {
      let on = !notifyOn(kind);
      if (on && "Notification" in window && Notification.permission === "default") await Notification.requestPermission();
      if (on && (!("Notification" in window) || Notification.permission !== "granted")) on = false;
      try { localStorage.setItem(NOTIFY[kind].key, on ? "on" : "off"); } catch (error) {}
      show();
    });
    show();
    return button;
  }
  function notified({ seat, kind }) {
    if (document.visibilityState === "visible" || !notifyOn(kind)) return;
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const body = kind === CARD ? `${seat} requires your action` : `${seat} finished their turn`;
    const shown = new Notification(title(state), { body, tag: seat });
    shown.addEventListener("click", () => {
      window.focus();
      sections.get(seat)?.section.scrollIntoView({ block: "nearest" });
      shown.close();
    });
  }

  const SUN ='<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.7v2.6M12 19.7v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M1.7 12h2.6M19.7 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9"/></svg>';
  const MOON = '<svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.7 14.6A8.7 8.7 0 0 1 9.4 3.3a8.9 8.9 0 1 0 11.3 11.3z"/></svg>';
  const SQUARE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>';
  // The copy button's icon: the clipboard, and the tick the stylesheet shows in its place while
  // the button says copied.
  const CLIPBOARD = '<svg class="clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  // How long the copy button says copied, in milliseconds.
  const COPIED_FOR = 1200;
  // How long a message found from a click on the line at its other end stays lit, in milliseconds.
  const FOCUS_FOR = 1500;
  // How often every panel decides whether it follows its newest row and pins it, in milliseconds.
  const KEEP_EVERY = 100;

  // How wide a line of text is in a box's own font, for a placeholder that must fit on one line.
  const gauge = document.createElement("canvas").getContext("2d");
  function textWidth(text, element) {
    const style = getComputedStyle(element);
    gauge.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
    return gauge.measureText(text).width;
  }

  // Every call to the server, with the page's secret on it. The server refuses a call without it
  // with 401, and a page that got one has been outlived by its server: reload and it has the
  // new secret. A 503 is the instance stopping: nothing is typed into it from here on.
  async function call(path, options = {}) {
    const answered = await fetch(path, {
      ...options,
      headers: { ...(options.headers ?? {}), authorization: `Bearer ${secret}` },
    });
    if (answered.status === 401) {
      location.reload();
      throw new Error("the server no longer knows this page");
    }
    if (answered.status === 503) {
      applyEvent(state, { name: "stopping", data: {} });
      draw();
    }
    return answered;
  }

  const state = fresh();
  const columns = { left: document.getElementById("left"), mid: document.getElementById("mid"), right: document.getElementById("right") };
  const favicon = document.querySelector('link[rel="icon"]');

  // ------------------------------------------------------------------------------- one panel

  const sections = new Map();
  // Within 80px of the newest row: close enough to count as reading the end.
  const nearTheNewest = (rows) => rows.scrollHeight - rows.scrollTop - rows.clientHeight < 80;
  // At the newest row, give or take the few px a zoomed scroll lands off by: the reader is at
  // the end of the rows, and the panel follows what lands there.
  const atTheNewest = (rows) => rows.scrollHeight - rows.scrollTop - rows.clientHeight < 4;

  function build(name) {
    const section = document.createElement("section");
    section.className = "panel";

    const headLine = document.createElement("div");
    headLine.className = "phead";
    const nameLine = document.createElement("span");
    nameLine.className = "name";
    const info = document.createElement("span");
    info.className = "info";
    const word = document.createElement("span");
    word.className = "state";
    headLine.append(nameLine, info, word);
    // The Leader's head carries, after the state word, how the page stands to the server and the
    // account's usage windows, and the theme toggle last, at the right edge.
    const leads = name === state.leader;
    const facts = leads ? { conn: document.createElement("span"), quota: document.createElement("span") } : null;
    if (facts !== null) {
      facts.conn.className = "conn";
      facts.quota.className = "quota";
      headLine.append(facts.conn, facts.quota);
    }
    if (leads) {
      themeToggle = document.createElement("button");
      themeToggle.type = "button";
      themeToggle.className = "theme";
      themeToggle.setAttribute("aria-label", "Light or dark");
      themeToggle.innerHTML = SUN + MOON;
      themeToggle.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
      applyTheme(document.documentElement.dataset.theme);
      headLine.append(themeToggle);
      headLine.append(notifySwitch(CARD), notifySwitch(REPLY));
    }

    const rows = document.createElement("div");
    rows.className = "rows";
    // Whether this panel follows its newest row: the panel's own word, decided by `following` at
    // every tick of the page's timer (keep, below), true from the start. Only a hand that moved
    // the rows away from the newest lets it go — a wheel up, an up key, a finger, the bar dragged
    // up, each noted here as `away` until the next tick — and being at the newest again engages
    // it, however the rows got there. Nothing the page does on its own — a row landing, a taller
    // box, a card, a resize, a row folding — is a word from the reader: a panel that follows is
    // pinned back to its newest at the next tick, and one that does not is left exactly where the
    // reader has it. Every panel has its own.
    const view = { follow: true, away: false, held: false };
    // the head shows whether the panel follows its newest row
    const showFollow = () => headLine.classList.toggle("follow", view.follow);
    const movedAway = () => {
      view.away = true;
    };
    rows.addEventListener("wheel", (event) => {
      if (event.deltaY < 0) movedAway();
    }, { passive: true });
    // The keys scroll the rows that hold the focus, so the rows can hold it: a click on them takes
    // it from the box, and a key pressed in a box reaches no rows.
    rows.tabIndex = -1;
    rows.addEventListener("keydown", (event) => {
      if (["ArrowUp", "PageUp", "Home"].includes(event.key)) movedAway();
    });
    // A finger moving down the screen scrolls the rows up.
    let finger = null;
    rows.addEventListener("touchstart", (event) => {
      finger = event.touches[0].clientY;
    }, { passive: true });
    rows.addEventListener("touchmove", (event) => {
      const at = event.touches[0].clientY;
      if (at > finger) movedAway();
      finger = at;
    }, { passive: true });
    // The bar is the one hand the rows report as scrolls alone: pressed on the rows themselves —
    // never on a row, whose press has a target of its own — and released anywhere, it moves the
    // rows away when a scroll in between took their top up.
    let top = 0;
    rows.addEventListener("pointerdown", (event) => {
      if (event.target === rows) view.held = true;
    });
    for (const done of ["pointerup", "pointercancel"]) {
      document.addEventListener(done, () => {
        view.held = false;
      });
    }
    rows.addEventListener("scroll", () => {
      if (view.held && rows.scrollTop < top) movedAway();
      top = rows.scrollTop;
    });
    // One tick of the page's timer: the word decided, shown, and a panel that follows pinned to
    // its newest — only when it is not there already, so a panel at rest writes nothing.
    const keep = () => {
      view.follow = following(view.follow, atTheNewest(rows), view.away);
      showFollow();
      view.away = false;
      if (view.follow && !atTheNewest(rows)) rows.scrollTop = rows.scrollHeight;
    };
    showFollow();
    // Whenever the rows change size, the stamps and the folds are measured again for the width.
    // The height is the timer's business: the bottom area under the rows grows with a taller box
    // or a card, the window is resized, and a panel that follows is pinned at the next tick.
    new ResizeObserver(() => {
      fitStamps(rows.querySelectorAll(".t"));
      fitFolds(rows.querySelectorAll(".msg.collapsed"));
    }).observe(rows);
    // One click handler for every copy button the rows will hold: the code inside the button's
    // block goes to the clipboard — the code element, never the button's own markup — and the
    // button says copied for a moment.
    rows.addEventListener("click", (event) => {
      const copy = event.target.closest(".copy");
      if (copy === null) return;
      const block = copy.parentElement;
      navigator.clipboard.writeText((block.querySelector("code") ?? block).textContent).then(() => {
        copy.classList.add("copied");
        setTimeout(() => copy.classList.remove("copied"), COPIED_FOR);
      }, () => {});
    });
    // On the Leader's panel, a pill for rows that arrived below where the reader is: shown when a
    // row lands while the reader is more than 80px above the newest, gone once they are near it
    // again or click it. It is the last child of the rows and sticks to their bottom edge, so it
    // sits above the bottom area — a card, the composer — never on it.
    let jump = null;
    if (leads) {
      jump = document.createElement("button");
      jump.type = "button";
      jump.id = "jump";
      jump.textContent = "↓ new messages";
      jump.addEventListener("click", () => {
        rows.scrollTop = rows.scrollHeight;
        jump.classList.remove("show");
      });
      rows.addEventListener("scroll", () => {
        if (nearTheNewest(rows)) jump.classList.remove("show");
      });
      rows.append(jump);
    }

    const composer = document.createElement("form");
    composer.className = "composer";
    const box = document.createElement("textarea");
    box.rows = 1;
    // The empty box says whom a message reaches and which key sends it; while a turn runs it says
    // so, and that Enter still sends. The whole sentence when it fits on one line, its head when
    // the box is too narrow for it; measured again whenever the box changes width, and by
    // drawPanel() whenever the state changes.
    const fitPlaceholder = () => {
      const busy = section.classList.contains("busy");
      const whole = busy ? `${name} is working — Enter still sends` : `Message ${name} — Enter sends, Shift+Enter for a new line`;
      const style = getComputedStyle(box);
      const room = box.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      box.placeholder = textWidth(whole, box) <= room ? whole : busy ? `${name} is working` : `Message ${name}`;
    };
    new ResizeObserver(fitPlaceholder).observe(box);
    // The box is one row until what is typed needs more, and stops growing at 40% of the window,
    // where it scrolls instead. A taller box takes its room from the rows; what that does to
    // their scroll position is the timer's business, never this one's.
    const autosize = () => {
      box.style.height = "auto";
      const max = window.innerHeight * 0.4;
      box.style.height = `${Math.min(box.scrollHeight, max)}px`;
      box.style.overflowY = box.scrollHeight > max ? "auto" : "hidden";
    };
    box.addEventListener("input", autosize);
    box.addEventListener("keydown", (event) => {
      if (keyAction(event) === "send") {
        event.preventDefault();
        composer.requestSubmit();
      }
    });
    // The stop glyph, over the box at its right edge: there while the turn can be stopped, gone
    // otherwise. A click interrupts the turn and nothing else — the process stays.
    const stop = document.createElement("button");
    stop.type = "button";
    stop.className = "stop";
    stop.title = `Stop ${name}'s turn`;
    stop.setAttribute("aria-label", "Stop the turn");
    stop.innerHTML = SQUARE;
    stop.addEventListener("click", () => {
      stop.hidden = true;
      call(`/sessions/${encodeURIComponent(name)}/stop`, { method: "POST" }).catch(() => {});
    });
    composer.append(box, stop);
    // The rows a click on a stamp pointed at, token to spelling; what is sent carries the spelling.
    const refs = new Map();
    // The last stamped row shown, and the one that was last when the first key went into an empty
    // box: a row arriving while the User types makes what is sent point back at the one it was
    // typed against. `beat` is when the server was last told a key went in, for the typing hold:
    // a key that changes what is in the box is told, at most once a beat, and nothing else is.
    const typing = { anchor: null, latest: null, beat: null };
    box.addEventListener("input", () => {
      if (box.value === "") {
        typing.anchor = null;
        return;
      }
      if (typing.anchor === null) typing.anchor = typing.latest;
      const now = Date.now();
      if (typingBeat(typing.beat, now)) {
        typing.beat = now;
        call(`/sessions/${encodeURIComponent(name)}/typing`, { method: "POST" }).catch(() => {});
      }
    });
    // What is typed goes to the server as text and nothing else: the server knows it came from
    // this page by the secret on the call, and frames it as the User's own words.
    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      if (box.value.trim() === "") {
        return;
      }
      const text = spellReferences(refs, typedAgainst(refs, typing.anchor, typing.latest, box.value));
      typing.anchor = null;
      box.value = "";
      autosize();
      call(`/sessions/${encodeURIComponent(name)}/message`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      }).catch(() => {});
    });

    // The bottom area, under the rows: the cards of the panel's questions, then the composer. It
    // takes its room from the rows in the panel's column, so a card or a taller box never covers
    // a row — the rows get shorter, and the timer keeps a following panel at its newest.
    const bottom = document.createElement("div");
    bottom.className = "bottom";
    const cards = document.createElement("div");
    cards.className = "cards";
    bottom.append(cards, composer);
    section.append(headLine, rows, bottom);
    // `last` is the tool line appended last, for a repeated call to count itself into; `lines` is
    // the element of every tool line by the index of its row, for a failed call to find its line;
    // `waiting` the element of every row of the User's not yet delivered, by its index, for the
    // delivery to find its row; `day` the day of the row drawn last, for the pill between two days;
    // `drawn` the card of every question on the panel, by the id of its request; `doing` the one
    // line that says what the seat is at, while there is one.
    return { name, section, nameLine, info, word, fitPlaceholder, facts, composer, stop, rows, cards, jump, box, refs, typing, view, keep, shown: 0, day: null, drawn: new Map(), loading: false, last: null, lines: new Map(), waiting: new Map(), doing: null };
  }

  // When a row was written, in the reader's own zone: `2026.09.13 Sunday 23:17:05` on the row, the
  // same on the pill between two days, and the day alone — `2026.09.13` — to tell one day from the
  // next.
  const timeOf = new Intl.DateTimeFormat("en-GB", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "long", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });

  function stamp(at) {
    if (at === undefined) return { whole: "", clock: "", day: "" };
    const part = Object.fromEntries(timeOf.formatToParts(new Date(at)).map((piece) => [piece.type, piece.value]));
    const day = `${part.year}.${part.month}.${part.day}`;
    const clock = `${part.hour}:${part.minute}:${part.second}`;
    return { whole: `${day} ${part.weekday} ${clock}`, clock, day };
  }

  // How long a User's row waited to go in: the clock of the write and the seconds since it was
  // typed, or null for a row with no time of its write.
  function waitedOf(entry) {
    if (entry.at === undefined || entry.deliveredAt === undefined) return null;
    return { clock: stamp(entry.deliveredAt).clock, seconds: Math.round((Date.parse(entry.deliveredAt) - Date.parse(entry.at)) / 1000) };
  }

  // A row's stamp is the whole day and time when it sits beside the whole label on one line, and
  // the time alone when the label would be cut to make room for it — the pill above says the day.
  // A status beside the stamp that has a glyph goes with it: the whole word while the stamp is
  // whole, the glyph alone while the stamp is the clock alone. Every stamp is set whole first and
  // all are measured after, so a change of width costs one layout and not one per row; the label
  // is the one part of the line that trims, so it is the label that says whether the line fits.
  function fitStamps(stamps) {
    for (const time of stamps) setStamp(time, false);
    const cut = [...stamps].filter((time) => { const label = time.parentElement.querySelector(".lbl"); return label.scrollWidth > label.clientWidth; });
    for (const time of cut) setStamp(time, true);
  }

  function setStamp(time, short) {
    time.textContent = short ? time.dataset.clock : time.dataset.whole;
    const st = time.parentElement.querySelector(".st");
    if (st !== null && st.dataset.glyph !== undefined) st.textContent = short ? st.dataset.glyph : st.dataset.whole;
  }

  // Whether a folded row has anything under its fold: its body, clamped to one line, is taller
  // inside than it shows, or it is not. Measured once the row is on the page, for the rows a draw
  // appended, and again for every folded row when the rows change size, since a body that fit one
  // width may not fit another. The mark is a class on the row — the pointer rule is under it, and
  // the double click answers only there. A row already open is left with the mark it was opened
  // with: unclamped, its body has nothing to measure. A row folded behind a placeholder has the
  // whole message under its fold by construction — its body is not drawn, so it measures nothing.
  function fitFolds(folded) {
    for (const row of folded) {
      if (!row.classList.contains("collapsed")) continue;
      const body = row.querySelector(".md, .text");
      row.classList.toggle("foldable", row.classList.contains("placeholder") || body.scrollHeight > body.clientHeight);
    }
  }

  // The pill between two days, and the one between two sessions: the same pill, a word on it.
  function pill(word) {
    const element = document.createElement("div");
    element.className = "divider";
    const text = document.createElement("span");
    text.textContent = word;
    element.append(text);
    return element;
  }

  // The pill between two days: the stamp of the first row of the new day, whole, marked as the
  // day's so the trim can tell it from a row. It is never the first thing on a panel and never
  // the last: it goes in only between a row of one day and a row of the next.
  function dayPill(when) {
    const element = pill(when.whole);
    element.dataset.day = when.day;
    return element;
  }

  // A click on a stamp points at its row from the panel's composer: the token goes into the box,
  // after a space when the box has words already, and the box takes the next keystroke.
  const REFERENCE = "click to reference this message in your reply";

  function pointAt(panel, time, who, body) {
    const token = reference(panel.refs, time.dataset.whole, who, body.textContent);
    if (token === null) return;
    const typed = panel.box.value;
    panel.box.value = `${typed}${typed !== "" && !/\s$/.test(typed) ? " " : ""}${token} `;
    panel.box.dispatchEvent(new Event("input"));
    if (!panel.box.disabled) panel.box.focus();
  }

  // A tool call is a light line, not a bubble: the summary as the element's own text, a counter
  // after it that a repeated call writes into, red once the call failed with the reason as its
  // tooltip. No label, no stamp. A line that is one end of a message between two sessions is
  // marked as such and carries the message's id: a click on it finds the message on the Leader's
  // panel.
  function lineElement(shown) {
    const line = document.createElement("div");
    line.className = "line";
    if (shown.err === true) line.classList.add("err");
    line.title = shown.why;
    line.textContent = shown.text;
    const count = document.createElement("span");
    count.className = "n";
    line.append(count);
    if (shown.msg !== undefined) {
      line.classList.add("peer");
      line.dataset.msg = shown.msg;
      line.onclick = () => focusMessage(shown.msg);
    }
    return line;
  }

  // The message a line on a Worker's panel is one end of, found on the Leader's panel by the id
  // both carry, opened, brought into view with its label at the top, and lit for a moment. The
  // Leader's panel draws every row it holds, so a message it has is there to find; one it has not
  // loaded yet is nothing to do.
  function focusMessage(id) {
    const leader = sections.get(state.leader);
    const found = leader === undefined ? null : leader.rows.querySelector(`.msg[data-msg="${id}"]`);
    if (found === null) return;
    found.classList.remove("collapsed");
    found.scrollIntoView({ block: "start" });
    for (const lit of leader.rows.querySelectorAll(".msg.focus")) lit.classList.remove("focus");
    found.classList.add("focus");
    setTimeout(() => found.classList.remove("focus"), FOCUS_FOR);
  }

  // A row is a bubble: the label row on top — who spoke, and when, last — and the body under it,
  // the HTML of a reply or the words of anyone else as they are. A tool call is a line instead.
  // A message the Leader sent carries what became of it as a glyph in the label row, after the
  // stamp in the DOM and before it on screen; its body is the compact markdown, one line of it
  // until a double click opens the row and a second one folds it again — where there is more than
  // the line, which the draw measures once the row is on the page; nothing is stored, so a
  // fresh page folds every one. A message between two sessions carries its id on the row, for a
  // click on the line the other panel draws for it, and what one Worker said to another is drawn
  // and folded the same way. The User's words — typed on a panel, or to a Worker — are shown
  // whole. The User's own row carries what became of
  // it too — the waiting words beside the label, on a dashed ground, then the delivered glyph
  // beside the stamp — read off the row and the panel's state at the draw, and every stamp is a
  // click that points at its row from the panel's composer.
  function rowElement(entry, shown, panel) {
    if (shown.kind === "line") return lineElement(shown);
    if (shown.kind === "divider") return pill(shown.text);
    const line = document.createElement("div");
    line.className = `msg ${shown.kind}`;
    if (shown.msg !== undefined) line.dataset.msg = shown.msg;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const meta = document.createElement("div");
    meta.className = "meta";
    const who = document.createElement("div");
    who.className = "who";
    const label = document.createElement("span");
    label.className = "lbl";
    label.textContent = shown.who;
    who.append(label);
    const time = document.createElement("span");
    time.className = "t";
    const when = stamp(entry.at);
    time.dataset.whole = when.whole;
    time.dataset.clock = when.clock;
    time.textContent = when.whole;
    meta.append(who, time);
    if (shown.status !== undefined) {
      const st = document.createElement("span");
      st.className = "st";
      if (shown.status.bad === true) st.classList.add("bad");
      st.textContent = shown.status.text;
      st.title = shown.status.title;
      meta.append(st);
    }
    if (shown.kind === "user") {
      const said = delivery(shown.delivered, panel.section.classList.contains("busy"), panel.name, waitedOf(entry));
      if (said.wait) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = said.text;
        who.append(tag);
        line.classList.add("pending");
      } else {
        meta.append(deliveredElement(said));
      }
    }
    const body = document.createElement("div");
    if (shown.html !== undefined) {
      body.className = "md";
      body.innerHTML = shown.html;
      if (shown.tight === true) body.classList.add("tight");
      for (const block of body.querySelectorAll("pre")) block.append(copyButton());
    } else {
      body.className = "text";
      body.textContent = shown.text;
    }
    bubble.append(meta, body);
    line.append(bubble);
    // The server's own rows fold too: a wait row names the whole call, and one line of it is enough.
    if (shown.kind === "peer-in" || shown.kind === "peer-out" || shown.kind === "overheard" || shown.kind === "chat") {
      line.classList.add("collapsed");
      line.addEventListener("dblclick", () => {
        if (line.classList.contains("foldable")) line.classList.toggle("collapsed");
      });
      // No first line to show, the renderer says: the fold is a placeholder in place of the body
      if (shown.placeholder === true) {
        line.classList.add("placeholder");
        const fold = document.createElement("div");
        fold.className = "fold";
        fold.textContent = "(double-click to see the whole message)";
        bubble.append(fold);
      }
    }
    time.title = REFERENCE;
    time.addEventListener("click", () => pointAt(panel, time, shown.who, body));
    if (when.whole !== "") panel.typing.latest = { whole: when.whole, who: shown.who, text: body.textContent };
    return line;
  }

  // The copy button a fenced code block carries in its corner; the rows' click handler does the
  // copying, so this is the element and nothing else.
  function copyButton() {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy";
    button.setAttribute("aria-label", "Copy");
    button.innerHTML = CLIPBOARD;
    return button;
  }

  // The delivered glyph beside the stamp: the whole word on it, and the glyph alone for the fit.
  function deliveredElement(said) {
    const st = document.createElement("span");
    st.className = "st";
    st.dataset.whole = said.text;
    st.dataset.glyph = said.glyph;
    st.textContent = said.text;
    return st;
  }

  // The User's row at that index, delivered: on the row it has, the ground changes, the waiting
  // words leave the label and the glyph goes in beside the stamp, fitted with it.
  function deliveredRow(panel, index, entry) {
    const element = panel.waiting.get(index);
    if (element === undefined) return;
    panel.waiting.delete(index);
    element.classList.remove("pending");
    element.querySelector(".tag").remove();
    const time = element.querySelector(".t");
    time.parentElement.append(deliveredElement(delivery(true, false, panel.name, waitedOf(entry))));
    fitStamps([time]);
  }

  // A question on this panel: a call the session is stopped on, or a rule the Leader asks the
  // User to settle. It is a card in the panel's bottom area, right above the composer — always in
  // sight, never in the scroll of the rows, and never a reason to scroll them. What it shows is
  // decided by dialogOf() — the words of the request and nothing else — and drawn here with
  // textContent as a card: the heading, then one block per field the request carried (the words
  // of a request in a raw block, a reason on a line of its own), then the row of decisions, one
  // button per decision that kind of question takes. A deny on a call stop needs a word from the
  // person, since the run is told why; a rule dialog carries the Leader's why already.
  function question(name, request) {
    const dialog = dialogOf(request, name);
    const card = document.createElement("div");
    card.className = "msg perm";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    card.append(bubble);
    const heading = document.createElement("div");
    heading.className = "desc";
    heading.textContent = dialog.heading;
    bubble.append(heading);
    for (const { kind, text } of dialog.lines) {
      const shown = document.createElement("div");
      if (kind === "reason" || kind === "why") shown.className = "reason";
      else shown.className = "raw";
      shown.textContent = text;
      bubble.append(shown);
    }

    // A question: each one with its options — one pick, or several where it takes several — and
    // Other last, an option like the rest whose words are a field in it. Typing there picks it,
    // and what is typed goes back only while it is picked (answerOf). What a question reads back
    // is its answer, or "" while there is none.
    const choices = (dialog.questions ?? []).map((asked, index) => {
      const block = document.createElement("div");
      block.className = "choice";
      const said = document.createElement("div");
      said.className = "reason";
      said.textContent = asked.header === "" ? asked.question : `${asked.header}: ${asked.question}`;
      block.append(said);
      const option = () => {
        const row = document.createElement("label");
        const pick = document.createElement("input");
        pick.type = asked.multiSelect ? "checkbox" : "radio";
        pick.name = `${request.id}-${index}`;
        const words = document.createElement("span");
        row.append(pick, words);
        block.append(row);
        return { pick, words };
      };
      const picks = asked.options.map(({ label, description }) => {
        const { pick, words } = option();
        pick.value = label;
        words.textContent = description === "" ? label : `${label} — ${description}`;
        return pick;
      });
      const { pick: other, words } = option();
      const own = document.createElement("input");
      own.type = "text";
      own.placeholder = "Other";
      own.addEventListener("input", () => {
        if (own.value.trim() !== "") {
          other.checked = true;
        }
      });
      words.append(own);
      bubble.append(block);
      return {
        question: asked.question,
        aim: () => (other.checked || picks.length === 0 ? own : picks[0]).focus(),
        read: () => answerOf({ picked: picks.filter((pick) => pick.checked).map((pick) => pick.value), other: other.checked, own: own.value }),
      };
    });

    const acts = document.createElement("div");
    acts.className = "acts";
    bubble.append(acts);
    const reason = dialog.kind === "call" ? document.createElement("input") : null;
    if (reason !== null) {
      reason.placeholder = "why not";
    }

    const buttons = dialog.buttons.map(({ decision, label }) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.dataset.decision = decision;
      return button;
    });

    function answer(body) {
      for (const button of buttons) {
        button.disabled = true;
      }
      call(`/sessions/${encodeURIComponent(name)}/permission`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      }).catch(() => {});
    }

    for (const button of buttons) {
      const decision = button.dataset.decision;
      button.addEventListener("click", () => {
        if (decision === "answer") {
          const unanswered = choices.find((choice) => choice.read() === "");
          if (unanswered !== undefined) {
            unanswered.aim();
            return;
          }
          answer({ id: request.id, decision, answers: Object.fromEntries(choices.map((choice) => [choice.question, choice.read()])) });
          return;
        }
        if (decision === "deny" && dialog.kind === "questions") {
          answer({ id: request.id, decision, why: "The User declined to answer." });
          return;
        }
        if (decision === "deny" && reason !== null) {
          if (reason.value.trim() === "") {
            reason.focus();
            return;
          }
          answer({ id: request.id, decision, why: reason.value.trim() });
          return;
        }
        answer({ id: request.id, decision });
      });
      if (decision === "deny" && reason !== null) {
        acts.append(reason);
      }
      acts.append(button);
    }
    return card;
  }

  // A panel made from a later event has no rows yet: they are asked for once, and arrive as
  // the rows of a stream do.
  function load(panel) {
    if (panel.loading) {
      return;
    }
    panel.loading = true;
    call(`/sessions/${encodeURIComponent(panel.name)}/messages`)
      .then((response) => response.json())
      .then(({ messages }) => {
        applyEvent(state, { name: "rows", data: { seat: panel.name, since: 0, rows: messages } });
        panel.loading = false;
        draw();
      })
      .catch(() => {
        panel.loading = false;
      });
  }

  function drawPanel(panel) {
    const about = state.panels[panel.name];
    const parts = head(state, panel.name);
    panel.nameLine.textContent = parts.name;
    panel.info.textContent = parts.info;
    panel.word.textContent = parts.state;
    panel.section.classList.toggle("dimmed", about.dimmed);
    panel.section.classList.toggle("asking", about.asking.length > 0);
    // The dot: green between turns, amber while one runs, red for a gone process and for every
    // panel while the page has no stream.
    const colour = dot(state, panel.name);
    panel.section.classList.toggle("idle", colour === GREEN);
    panel.section.classList.toggle("busy", colour === AMBER);
    panel.section.classList.toggle("gone", colour === RED);
    panel.stop.hidden = !stopEnabled(state, panel.name);
    panel.box.disabled = !composersEnabled(state, panel.name);
    panel.fitPlaceholder();
    if (panel.facts !== null) {
      panel.facts.conn.textContent = state.connection;
      panel.facts.conn.classList.toggle("off", state.connection !== CONNECTED);
      panel.facts.quota.textContent = quotaLine(state.quota);
      panel.facts.quota.title = quotaTitle(state.quota, (iso) => stamp(iso).whole);
    }

    if (about.rows === null) {
      load(panel);
    } else {
      // Whether the reader is near the newest row is taken before anything lands, and on the first
      // draw they are: the timer pins a panel that follows, and the draw scrolls nothing itself.
      const near = panel.shown === 0 || nearTheNewest(panel.rows);
      if (about.rows.length < panel.shown) {
        panel.rows.replaceChildren();
        panel.shown = 0;
        panel.day = null;
        panel.last = null;
        panel.lines.clear();
        panel.waiting.clear();
        panel.doing = null;
        // The cards are not among the rows: they stand, and leave when their question does.
      }
      // Whether any row landed — a bubble, a pill, a tool line, or a repeated call that only grew
      // its counter — is what decides the scroll; the stamps appended are for the fitter alone,
      // since a tool line carries no stamp, and the rows appended folded are for the fold's measure.
      let landed = false;
      const added = [];
      const folded = [];
      if (about.rows.length > panel.shown) {
        // A Worker panel keeps its last hundred rows, so its first draw starts there: a long log
        // builds a hundred elements, not thousands. The Leader's panel draws every row it holds.
        const from = panel.jump === null && panel.shown === 0 ? Math.max(panel.shown, about.rows.length - 100) : panel.shown;
        // A pill names the day between the last row of one day and the first row of the next —
        // never before the first row drawn, whatever its day, and never before a row that says when
        // a session ended or started, which names the day itself (dayPillBefore). A tool call that repeats the line
        // appended last counts itself into that line rather than drawing a second one; any other
        // row — a bubble, a pill — ends the run.
        for (const [offset, entry] of about.rows.slice(from).entries()) {
          const index = from + offset;
          if (collapsed(about.rows, index)) continue;
          const when = stamp(entry.at);
          if (entry.at !== undefined && when.day !== panel.day) {
            if (dayPillBefore(entry, panel.day)) {
              panel.last = null;
              panel.rows.append(dayPill(when));
            }
            panel.day = when.day;
          }
          const shown = rowOf(entry, { chat: state.chat, seat: panel.name, leader: state.leader, user: state.user });
          // A line that is one end of a message is its own: two messages are two lines, never
          // one with a counter, since each is a click to a different row.
          if (shown.kind === "line" && shown.msg === undefined && panel.last !== null && panel.last.text === shown.text) {
            panel.last.count += 1;
            panel.last.n.textContent = ` ×${panel.last.count}`;
            landed = true;
            panel.lines.set(index, panel.last.el);
            continue;
          }
          const line = rowElement(entry, shown, panel);
          panel.rows.append(line);
          landed = true;
          if (shown.kind === "line") {
            panel.last = shown.msg === undefined ? { text: shown.text, el: line, count: 1, n: line.lastElementChild } : null;
            panel.lines.set(index, line);
          } else {
            panel.last = null;
            if (shown.kind === "user" && !shown.delivered) panel.waiting.set(index, line);
          }
          const time = line.querySelector(".t");
          if (time !== null) added.push(time);
          if (line.classList.contains("collapsed")) folded.push(line);
        }
        fitStamps(added);
        fitFolds(folded);
        panel.shown = about.rows.length;
        // A Worker panel keeps a hundred drawn rows — bubbles, lines and pills —
        // and lets the oldest go, with the lines it no longer holds.
        if (panel.jump === null) {
          const drawn = [...panel.rows.children].filter((child) => child.matches(".msg, .line, .divider"));
          while (drawn.length > 100) drawn.shift().remove();
          // The day pill goes with the rows before it: it is never the first thing on a panel.
          while (drawn.length > 0 && drawn[0].dataset.day !== undefined) drawn.shift().remove();
          for (const kept of [panel.lines, panel.waiting]) {
            for (const [index, element] of kept) {
              if (!element.isConnected) kept.delete(index);
            }
          }
        }
      }
      // A call that failed after its line was drawn: the line at that row's index turns red, with
      // the reason the result gave as its tooltip. A row of the User's delivered after it was
      // drawn: the row at that index reads so.
      for (const index of about.amended.splice(0)) {
        const element = panel.lines.get(index);
        if (element !== undefined && about.rows[index].err === true) {
          element.classList.add("err");
          element.title = about.rows[index].why ?? "";
        }
        if (about.rows[index].delivered === true) deliveredRow(panel, index, about.rows[index]);
      }
      // The questions, in the bottom area: a card answered or taken down leaves, a card not yet
      // drawn goes in after the cards there. Nothing here scrolls the rows for a card: it is not
      // in them, and a taller bottom area is the timer's business.
      for (const [id, card] of panel.drawn) {
        if (!about.asking.some((request) => request.id === id)) {
          card.remove();
          panel.drawn.delete(id);
        }
      }
      for (const request of about.asking) {
        if (!panel.drawn.has(request.id)) {
          const card = question(panel.name, request);
          panel.drawn.set(request.id, card);
          panel.cards.append(card);
        }
      }
      // The one line that says what the seat is at, while the server says it: put in once when the
      // word comes, its text changed in place at every change, taken out once the word is gone —
      // never taken out and put back within a turn, so the rows never jump for it. It is the last
      // row, after whatever landed: its coming counts as a row landing, a change of its words does
      // not, since it is one line high whatever they say.
      if (about.doing === null) {
        if (panel.doing !== null) {
          panel.doing.remove();
          panel.doing = null;
        }
      } else {
        if (panel.doing === null) {
          panel.doing = document.createElement("div");
          panel.doing.className = "line doing";
          landed = true;
        }
        panel.doing.textContent = about.doing;
        if (landed) panel.rows.append(panel.doing);
      }
      // Rows are appended after the pill; it goes back to the end so it sticks to the bottom edge.
      if (panel.jump !== null && panel.jump !== panel.rows.lastElementChild) panel.rows.append(panel.jump);
      // A row that landed while the reader is away from the newest: the pill says something
      // landed below. A panel that follows is pinned to the newest by the timer, not here.
      if (landed && !panel.view.follow && panel.jump !== null && !near) {
        panel.jump.classList.add("show");
      }
    }
  }

  // ------------------------------------------------------------------------------- the page

  function draw() {
    for (const name of Object.keys(state.panels)) {
      if (!sections.has(name)) {
        sections.set(name, build(name));
      }
    }
    for (const [name, panel] of sections) {
      if (state.panels[name] === undefined) {
        panel.section.remove();
        sections.delete(name);
      }
    }
    const placed = place([...sections.keys()], state.leader, state.order);
    for (const [side, names] of [["left", placed.left], ["mid", [placed.mid]], ["right", placed.right]]) {
      const wanted = names.filter((name) => sections.has(name)).map((name) => sections.get(name).section);
      if (wanted.some((section, at) => columns[side].children[at] !== section) || columns[side].children.length !== wanted.length) {
        columns[side].replaceChildren(...wanted);
      }
    }
    for (const panel of sections.values()) {
      drawPanel(panel);
    }
    document.title = title(state);
    // The tab's icon carries the asking state, the title never: the same mark with its ring in
    // the warn colour while any panel asks, the plain one otherwise. Set only when it changes, so
    // a draw that changes nothing does not make the browser fetch the icon again.
    const icon = anyAsking(state) ? "/icons/192-asking.png" : "/icons/192.png";
    if (favicon.getAttribute("href") !== icon) favicon.setAttribute("href", icon);
  }

  // One stream from the server: what to draw first, then everything as it happens. The page
  // connects again itself when the stream drops, with the counts it has, so nothing arrives
  // twice and nothing is missed; the secret rides on the address, since the stream carries no
  // header.
  const EVENTS = ["snapshot", "rows", "row", "asking", "seat", "quota", "stopping"];
  let stream = null;

  function connect() {
    const since = Object.values(state.panels)
      .filter((panel) => panel.rows !== null)
      .map((panel) => `&since=${encodeURIComponent(`${panel.name}:${panel.rows.length}`)}`)
      .join("");
    stream = new EventSource(`/events?page=${encodeURIComponent(secret)}${since}`);
    for (const name of EVENTS) {
      stream.addEventListener(name, (event) => {
        const data = JSON.parse(event.data);
        // What the event is worth telling a reader who is not here, read before it is applied.
        const notice = noticed(state, { name, data });
        applyEvent(state, { name, data });
        keepLines();
        draw();
        if (notice !== null) notified(notice);
      });
    }
    stream.addEventListener("open", () => {
      state.connection = CONNECTED;
      draw();
    });
    stream.addEventListener("error", () => {
      stream.close();
      lost();
      setTimeout(probe, 1000);
    });
  }

  // A stream that dropped: the server is gone, or stopping, or the line was cut — the page has no
  // stream either way, and says so. It asks the server about it once a second: a 401 is a new
  // server and a new secret (reload, in call), a 503 the instance still stopping, no answer at all
  // the server gone; anything else, the stream is opened again.
  function lost() {
    if (state.connection !== DISCONNECTED) {
      state.connection = DISCONNECTED;
      draw();
    }
  }

  function probe() {
    call("/sessions").then(
      (answered) => (answered.status === 503 ? setTimeout(probe, 1000) : connect()),
      () => {
        lost();
        setTimeout(probe, 1000);
      },
    );
  }

  // The tool lines move on their own once a word has had its time: one timer, set for the soonest
  // word due on any panel after every event and every firing, and none while nothing waits.
  let lineTimer = null;
  function keepLines() {
    clearTimeout(lineTimer);
    const due = advance(state, Date.now());
    if (due !== null) {
      lineTimer = setTimeout(() => {
        keepLines();
        draw();
      }, Math.max(0, due - Date.now()));
    }
  }

  connect();
  setInterval(() => {
    if (prune(state, Date.now()).length > 0) {
      draw();
    }
  }, 1000);
  // Every panel keeps its word and its place ten times a second: a panel that follows is pinned
  // to its newest whatever moved the bottom away — a row that landed, a taller box, a card, a
  // resize — and a panel at rest writes nothing.
  setInterval(() => {
    for (const panel of sections.values()) panel.keep();
  }, KEEP_EVERY);
</script>
