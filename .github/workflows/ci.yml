name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A release calls this file rather than keeping a copy of the list: what a release is checked
  # against and what a push is checked against are then the same checks, and cannot drift apart.
  workflow_call:

# Nothing here writes anything. Said out loud because the release workflow calls this one, and a
# called workflow is handed the caller permissions unless it asks for less.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck over tracked shell scripts
        run: |
          set -euo pipefail
          scripts=()
          while IFS= read -r file; do
            # A shell script is one that says so on its first line. Matching on a .sh suffix
            # alone would miss the commands, which are named the way they are typed.
            if [[ "${file}" == *.sh ]] || head -n 1 -- "${file}" | grep -qE '^#!.*\b(bash|sh)$'; then
              scripts+=("${file}")
            fi
          done < <(git ls-files)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts tracked yet; nothing to check."
            exit 0
          fi
          printf 'Checking %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          # -x so a script that sources a shared helper is checked with the helper in view.
          shellcheck -x "${scripts[@]}"

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One pin, read from the file the version managers read, so every job runs the
          # Node an instance is required to have and nothing is tested on a second one.
          node-version-file: .node-version

      - name: Install an instance and check what it made
        run: node --test tests/install.test.mjs

  chat:
    name: Chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Serve the chat and talk to it
        run: node --test tests/chat.test.mjs

  command:
    name: Command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check status and login
        run: node --test tests/ovai.test.mjs

  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Take a newer version, and refuse to
        run: node --test tests/update.test.mjs

  store:
    name: Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Remember and recall
        run: node --test tests/store.test.mjs

  helper:
    name: Helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Ask the helper, and refuse what it answers badly
        run: node --test tests/helper.test.mjs

  frames:
    name: Frames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Frame what a session is told
        run: node --test tests/frames.test.mjs

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Mint, resolve and revoke a secret
        run: node --test tests/secrets.test.mjs

  quota:
    name: Quota
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Read the windows, stage them, hold at the gate
        run: node --test tests/quota.test.mjs

  usage:
    name: Usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Ask the account how much of its windows is spent, say it in words
        run: node --test tests/usage.test.mjs

  lifecycle:
    name: Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Start, tell, restart, stop and park the seats
        run: node --test tests/lifecycle.test.mjs

  permissions:
    name: Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Ask to be allowed, and answer
        run: node --test tests/permissions.test.mjs

  hook:
    name: Hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Let a compound of allowed commands through, and nothing else
        run: node --test tests/hook.test.mjs

  dialog:
    name: Dialog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Show a question in the words it was asked in
        run: node --test tests/dialog.test.mjs

  personas:
    name: Personas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Tell a Leader and a Worker only what is there
        run: node --test tests/personas.test.mjs

  panels:
    name: Panels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Place the seats in three columns and keep their rows
        run: node --test tests/panels.test.mjs

  render:
    name: Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Draw a row as markdown, and nothing a row must not do
        run: node --test tests/render.test.mjs

  page:
    name: Page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Read the stylesheet as rules, and hold every colour to the token table
        run: node --test tests/page.test.mjs

  lines:
    name: Lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Read what every tool call is drawn as
        run: node --test tests/lines.test.mjs

  desks:
    name: Desks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: File a desk away and read what is left
        run: node --test tests/desks.test.mjs

  start:
    name: Start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Record the trust before serving, refuse when it is not on disk
        run: node --test tests/start.test.mjs

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite asks what a release of a tree would be, and one of its answers is "that
          # version is already out". It makes its own repositories to ask that of, but a shallow
          # clone would still be a poor thing to run a check about tags in.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Work out what a release would be, and what it refuses to be
        run: node --test tests/tag.test.mjs
