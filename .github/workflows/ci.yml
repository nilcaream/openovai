name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A release calls this file rather than keeping a copy of the list: what a release is checked
  # against and what a push is checked against are then the same checks, and cannot drift apart.
  workflow_call:

# Nothing here writes anything. Said out loud because the release workflow calls this one, and a
# called workflow is handed the caller permissions unless it asks for less.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck over tracked shell scripts
        run: |
          set -euo pipefail
          scripts=()
          while IFS= read -r file; do
            # A shell script is one that says so on its first line. Matching on a .sh suffix
            # alone would miss the commands, which are named the way they are typed.
            if [[ "${file}" == *.sh ]] || head -n 1 -- "${file}" | grep -qE '^#!.*\b(bash|sh)$'; then
              scripts+=("${file}")
            fi
          done < <(git ls-files)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts tracked yet; nothing to check."
            exit 0
          fi
          printf 'Checking %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          # -x so a script that sources a shared helper is checked with the helper in view.
          shellcheck -x "${scripts[@]}"

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One pin, read from the file the version managers read, so every job runs the
          # Node an instance is required to have and nothing is tested on a second one.
          node-version-file: .node-version

      - name: Install an instance and check what it made
        run: node --test tests/install.test.mjs

  chat:
    name: Chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Serve the chat and talk to it
        run: node --test tests/chat.test.mjs

  command:
    name: Command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check status and login
        run: node --test tests/ovai.test.mjs

  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Take a newer version, and refuse to
        run: node --test tests/update.test.mjs

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite asks what a release of a tree would be, and one of its answers is "that
          # version is already out". It makes its own repositories to ask that of, but a shallow
          # clone would still be a poor thing to run a check about tags in.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Work out what a release would be, and what it refuses to be
        run: node --test tests/tag.test.mjs
