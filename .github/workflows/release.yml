name: Release

# Cutting a release is one click here and nothing on anybody's laptop. What it needs is already in
# the repository — the version in lib/VERSION, what changed in NOTES.md — so there is nothing to type
# in and nothing to paste, and the two ways a release goes wrong by hand (a tag that does not match
# the version, notes that are not the ones in the file) cannot happen.
#
# The token is the one GitHub gives the run: `contents: write` below is what lets it push a tag and
# publish a release, and it is the only permission this has. The one thing stored is the key the
# package is signed with, the repository secret RELEASE_SIGNING_KEY, read by the sign job alone —
# and, while a key is being replaced, the new one as RELEASE_SIGNING_KEY_NEXT.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag is forever, and the archive people download is made from it — so the one thing a release
  # must not be is cut from a tree the checks were never run on. Nothing about a click says the
  # tests passed: CI starts on a push and this starts on a button, and the two ran side by side
  # with neither waiting for the other. So the release runs them itself. This is CI, the same file,
  # called rather than copied, and the job below waits on it.
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and every tag: a version that is already released is refused by
          # looking for its tag, and a shallow clone cannot see one.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # workflow_dispatch offers every branch. A release is cut from main and the archive people
      # download is made from the tag, so a tag on anything else is a release of something nobody
      # reviewed.
      - name: Refuse to release anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release is cut from main, and this run is on ${GITHUB_REF}"
          exit 1

      # Everything that can be refused is refused here, before a tag exists: no version, a version
      # already released, notes that say nothing about it. See .github/tag.mjs.
      - name: Work out the tag and the notes
        id: release
        run: node .github/tag.mjs --notes-file "${RUNNER_TEMP}/notes.md"

      - name: Tag the commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Annotated, because a release tag says who cut it and when, and that is what the page
          # shows. The identity is the one on the commit being tagged: the history keeps one voice
          # and a fork tags as itself with nothing here to change.
          git -c "user.name=$(git log -1 --format=%an)" -c "user.email=$(git log -1 --format=%ae)" \
            tag -a "${TAG}" -m "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NAME: ${{ steps.release.outputs.name }}
          NOTES: ${{ steps.release.outputs.notes-file }}
        run: |
          set -euo pipefail
          # --verify-tag so this drafts the tag the step above pushed and never invents one of its
          # own; --draft because a release is not the latest until the sign job has attached its
          # signed package, and an instance asking for the latest release takes only a signed one.
          url="$(gh release create "${TAG}" --title "${NAME}" --notes-file "${NOTES}" --draft --verify-tag)"
          printf 'drafted %s\n' "${url}"
          {
            printf '## %s\n\n' "${NAME}"
            cat "${NOTES}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # The package people install, made from the tag, and signed. A job of its own with no `uses:` at
  # all: the key is in this job's memory, and nothing runs beside it but git, ssh-keygen and gh from
  # the runner — no action fetched from anywhere else, pinned or not. The clone is of the tag the
  # release job pushed, and the package is `git archive` of it, so what is signed is that tag's tree.
  #
  # When this fails the release is a draft that nobody updates to. "Re-run failed jobs" runs this
  # again; running the whole workflow again is refused, since the tag is already out.
  sign:
    name: Sign
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Make the package of the tag, and its SHA256SUMS
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "${TAG}" "https://github.com/${GITHUB_REPOSITORY}.git" src
          version="${TAG#v}"
          if [ "$(cat src/lib/VERSION)" != "${version}" ]; then
            echo "::error::${TAG} holds $(cat src/lib/VERSION) in lib/VERSION"
            exit 1
          fi
          git -C src archive --format=tar.gz --prefix="openovai-${version}/" "${TAG}" > "openovai-${version}.tar.gz"
          sha256sum "openovai-${version}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          NEXT: ${{ secrets.RELEASE_SIGNING_KEY_NEXT }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${KEY}" ]; then
            echo "::error::the repository secret RELEASE_SIGNING_KEY is not set, so nothing can be signed"
            exit 1
          fi
          printf '%s\n' "${KEY}" > "${RUNNER_TEMP}/key"
          ssh-keygen -Y sign -q -f "${RUNNER_TEMP}/key" -n openovai-release SHA256SUMS
          # The key being brought in signs as well, under a name of its own, so an instance that
          # pins either key takes this release.
          if [ -n "${NEXT}" ]; then
            printf '%s\n' "${NEXT}" > "${RUNNER_TEMP}/next"
            cp SHA256SUMS "${RUNNER_TEMP}/sums"
            ssh-keygen -Y sign -q -f "${RUNNER_TEMP}/next" -n openovai-release "${RUNNER_TEMP}/sums"
            mv "${RUNNER_TEMP}/sums.sig" SHA256SUMS.next.sig
          fi
          rm -f "${RUNNER_TEMP}/key" "${RUNNER_TEMP}/next"

      # A secret whose key the tag does not pin would sign a release no instance takes: found here,
      # before anything is attached, rather than on everybody's machine.
      - name: Check every signature against the keys the tag pins
        run: |
          set -euo pipefail
          for signature in SHA256SUMS*.sig; do
            ssh-keygen -Y verify -f src/lib/RELEASE_KEYS -I openovai-release -n openovai-release -s "${signature}" < SHA256SUMS
          done

      - name: Attach them to the release, and publish it as the latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" openovai-*.tar.gz SHA256SUMS SHA256SUMS*.sig --repo "${GITHUB_REPOSITORY}"
          gh release edit "${TAG}" --draft=false --latest --repo "${GITHUB_REPOSITORY}"
          printf 'released %s, signed\n' "${TAG}" | tee -a "${GITHUB_STEP_SUMMARY}"
